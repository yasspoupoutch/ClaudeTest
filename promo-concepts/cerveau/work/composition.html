<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CNSNN — ton cerveau sait lire sans voyelles</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="kit.css">
<style>
.c { position: absolute; left: 0; right: 0; text-align: center; }
#q { top: 250px; font-size: 66px; font-weight: 800; letter-spacing: -1px; }
#pill { position: absolute; left: 50%; top: 250px; height: 96px; padding: 0 44px; border-radius: 999px; transform: translateX(-50%); display: flex; align-items: center; gap: 18px;
  font-size: 36px; font-weight: 700; letter-spacing: 4px; white-space: nowrap; }
#pill i { width: 22px; height: 22px; border-radius: 50%; }
.sent { position: absolute; left: 0; right: 0; text-align: center; font-family: "Instrument Serif", serif; line-height: 1.12; }
.sent div { white-space: nowrap; }
#bar { position: absolute; left: 190px; right: 190px; top: 1240px; height: 14px; border-radius: 7px; background: rgba(255,255,255,.1); overflow: hidden; }
#bar b { display: block; height: 100%; background: linear-gradient(90deg, #f6b84d, #ffd673); transform-origin: 0 50%; }
#ex1 { top: 1170px; font-family: "Instrument Serif", serif; font-size: 78px; }
#ex2 { top: 1265px; font-family: "Instrument Serif", serif; font-style: italic; font-size: 78px; color: #ffc65a; }
#hint { top: 930px; left: 110px; right: 110px; font-family: "Instrument Serif", serif; font-style: italic; font-size: 64px; line-height: 1.15; color: rgba(244,245,248,.8); }
.ring { top: 1180px; }
.verdict { top: 1250px; font-family: "Instrument Serif", serif; font-style: italic; font-size: 92px; color: #5ae6c6; }
#ph { left: 50%; top: 560px; margin-left: -280px; }
#ph img { position: absolute; inset: 0; width: 100%; height: 100%; }
#dj { top: 300px; font-family: "Instrument Serif", serif; font-size: 84px; }
#dj i { color: #ffc65a; }
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="b1"></div><div class="blob" id="b2"></div>
  <div class="c" id="q">Tu arrives à lire ça ?</div>
  <div id="pill"><i></i><span></span></div>
  <div class="sent" id="s1" style="top:560px;font-size:126px"><div></div><div></div><div></div></div>
  <div id="bar"><b></b></div>
  <div class="c" id="ex1">Ton cerveau devine les mots…</div>
  <div class="c" id="ex2">grâce aux consonnes.</div>
  <div class="sent" id="s2" style="top:600px;font-size:132px"><div></div><div></div></div>
  <div class="sent" id="s3" style="top:640px;font-size:200px"><div></div></div>
  <div class="c" id="hint">« Une fleur jaune qui devient une boule de graines à souffler. »</div>
  <div class="ring" id="ring"></div>
  <div class="c verdict" id="v2">Très fort !</div>
  <div class="c verdict" id="v3">Pissenlit ! Expert.</div>
  <div class="c" id="dj">Un mot comme ça, <i>chaque jour.</i></div>
  <div class="phone" id="ph"><div class="scr"><img src="game_slots.png"></div></div>
</div>
<script src="lib.js"></script>
<script src="kit.js"></script>
<script>
// Level 1 and 2 are made-up sentences; level 3 is a real card (Shared/cards.tsv, Général, difficile).
const S1 = ['TU ARRIVES', 'À LIRE', 'CETTE PHRASE ?'], S2 = ['SI TU LIS ÇA,', 'TU ES TRÈS FORT'], S3 = ['PISSENLIT'];
const T2 = 7.2, T3 = 12.2, END = 18.1;   // level 2, level 3, end card (timed on the voice, see voice_lines.json)
const CUES = { search: 0.45, type: 0.75, result: 2.3, consonne: 4.1, free: 5.6 };   // the end card follows the spelling of CNSNN
let L1, L2, L3;
window.setup = async () => {
  await document.fonts.ready;
  const lines = (id, S) => S.map((w, i) => { const L = buildSlots($(id).children[i], w); measureSlots(L); return L; });
  L1 = lines('s1', S1); L2 = lines('s2', S2); L3 = lines('s3', S3);
  makeRing($('ring')); buildEnd();
  return true;
};
// vowels of a multi-line sentence, revealed in reading order from t0
const fillLines = (Ls, t, t0, step = 0.07) => {
  let k = 0;
  Ls.forEach(L => { const k0 = k; fill(L, j => spring(t - (t0 + (k0 + j) * step), 0.4, 0.62)); k += L.filter(l => l.v).length; });
};
const show = (el, a, b, t, tf = '') => set(el, ease(prog(t, a, a + 0.3)) * (1 - prog(t, b, b + 0.25)), tf);
window.render = (t) => {
  ambient(t, 0.6);
  // ---- level 1 (0–6.9): the hook sentence, read in consonants, then the vowels drop in
  const qi = ease(prog(t, 0.05, 0.3));
  set($('q'), qi * (1 - prog(t, 2.9, 3.2)), `scale(${lerp(1.15, 1, qi)})`);
  const s1 = spring(t - 0.15, 0.45, 0.7);
  set($('s1'), clamp(s1 * 1.5) * (1 - prog(t, 6.5, 6.8)), `scale(${lerp(0.85, 1, clamp(s1))}) translateY(${-140 * ease(prog(t, 3.9, 4.5))}px)`);
  fillLines(L1, t, 2.75);
  set($('bar'), t > 0.3 && t < 2.9 ? 1 : 0); $('bar').querySelector('b').style.transform = `scaleX(${1 - prog(t, 0.4, 2.7)})`;
  show($('ex1'), 4.1, 6.5, t, `translateY(${(1 - ease(prog(t, 4.1, 4.4))) * 20}px)`);
  show($('ex2'), 4.7, 6.5, t, `translateY(${(1 - ease(prog(t, 4.7, 5.0))) * 20}px)`);
  // ---- pill for levels 2 and 3
  const lvl = t >= T3 ? 3 : 2, tl = lvl === 3 ? T3 : T2;
  $('pill').querySelector('span').textContent = lvl === 3 ? 'NIVEAU 3 · EXPERT' : 'NIVEAU 2';
  $('pill').querySelector('i').style.background = lvl === 3 ? '#ff8785' : '#ffc65a';
  $('pill').style.background = 'rgba(255,255,255,.08)'; $('pill').style.border = '2px solid rgba(255,255,255,.16)';
  const pi = ease(prog(t, tl, tl + 0.3)); set($('pill'), t >= T2 && t < END - 2.3 ? pi * (1 - prog(t, tl + 4.5, tl + 4.8)) : 0, `translateX(-50%) translateY(${(1 - pi) * -30}px)`);
  // ---- level 2 (6.9–11.9): 3 s on the clock
  const s2 = spring(t - T2, 0.45, 0.7); set($('s2'), t >= T2 ? clamp(s2 * 1.5) * (1 - prog(t, T3 - 0.4, T3 - 0.1)) : 0, `scale(${lerp(0.85, 1, clamp(s2))})`);
  fillLines(L2, t, T2 + 3.5);
  set($('v2'), ease(prog(t, T2 + 4.0, T2 + 4.3)) * (1 - prog(t, T3 - 0.4, T3 - 0.1)), `scale(${lerp(0.7, 1, spring(t - T2 - 4.0))})`);
  // ---- level 3: a real card, one word
  const s3 = spring(t - T3, 0.45, 0.7); set($('s3'), t >= T3 ? clamp(s3 * 1.5) * (1 - prog(t, T3 + 4.35, T3 + 4.65)) : 0, `scale(${lerp(0.85, 1, clamp(s3))})`);
  set($('hint'), ease(prog(t, T3 + 0.3, T3 + 0.6)) * (1 - prog(t, T3 + 4.35, T3 + 4.65)));
  fill(L3[0], j => spring(t - (T3 + 3.5 + j * 0.1), 0.4, 0.62));
  set($('v3'), ease(prog(t, T3 + 4.0, T3 + 4.3)) * (1 - prog(t, T3 + 4.35, T3 + 4.65)), `scale(${lerp(0.7, 1, spring(t - T3 - 4.0))})`);
  // the ring counts 3 seconds on levels 2 and 3
  const rt = t >= T3 ? t - T3 : t - T2, on = t >= T2 && rt >= 0.4 && rt < 3.55;
  set($('ring'), on ? 1 : 0, `scale(${1 + 0.12 * Math.exp(-((rt - 0.4) % 1) * 10)})`);
  ring($('ring'), prog(rt, 0.4, 3.4), clamp(3 - Math.floor(rt - 0.4), 1, 3));
  // ---- the app: "a word like that, every day"
  const dj = ease(prog(t, T3 + 4.5, T3 + 4.9)); set($('dj'), dj * (1 - prog(t, END - 0.3, END)), `translateY(${(1 - dj) * 20}px)`);
  const ph = spring(t - T3 - 4.6, 0.6, 0.75); set($('ph'), t >= T3 + 4.6 ? clamp(ph * 1.4) * (1 - prog(t, END - 0.3, END)) : 0,
    `translateY(${(1 - ph) * 700}px) rotate(${lerp(8, -3, clamp(ph))}deg) scale(0.86)`);
  renderEnd(t, END, CUES);
  return true;
};
</script>
</body>
</html>
