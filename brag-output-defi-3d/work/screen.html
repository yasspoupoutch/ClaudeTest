<script>
const AV = { 'Léa': '#f3b94c', 'Malik': '#49d9b9', 'Inès': '#aa99ff', 'Tom': '#f28abd' };
['Léa', 'Malik', 'Inès', 'Tom'].forEach(n => { const d = document.createElement('div'); d.style.background = AV[n]; d.textContent = n[0]; $('gav').appendChild(d); });
const share = (time) => `<div class="share"><div class="mark">C<span class="v">O</span>NS<span class="v">O</span>NN<span class="v">E</span></div>
  <div class="ttl">MOT DU JOUR · 2026-10-20</div><div class="cons serif">CHCRT</div><div class="cap"></div>
  <div class="out">Trouvé en ${time}</div><div class="q italic">Trouverez-vous les voyelles ?</div></div>`;

// Thread. br: 'both' | 'A' (first timeline) | 'B' (after "Et si…"). at: appearance time on that timeline.
const T = [
  { at: -1, br: 'both', ts: '<b>Hier</b> 23:12' },
  { at: -1, br: 'both', who: 'Tom', html: 'bonne nuit les gens 😴' },
  { at: -1, br: 'both', ts: '<b>Aujourd’hui</b> 22:44' },
  { at: -1, br: 'both', who: 'Léa', raw: share('0:41'), noAv: true },
  { at: -1, br: 'both', who: 'Léa', html: '0:41. Battez ça 😏', cont: true },
  { at: 1.9, until: 2.75, br: 'both', who: 'Malik', typing: true },
  { at: 2.75, br: 'both', who: 'Malik', html: 'CHCRT ??? 😭' },
  { at: 3.25, until: 4.0, br: 'both', who: 'Inès', typing: true },
  { at: 4.0, br: 'both', who: 'Inès', html: 'c’est trop dur 😭' },
  { at: 4.55, until: 5.35, br: 'both', who: 'Léa', typing: true },
  { at: 5.35, br: 'both', who: 'Léa', html: 'pas de spoil 🤫' },
  { at: 9.75, br: 'A', who: 'Vous', html: 'chocolat', tb: [10.5, 'HA<br>HA'], lu: true },
  { at: 11.2, br: 'A', who: 'Malik', html: 'CHCLT ≠ CHCRT 💀' },
  { at: 12.0, br: 'A', who: 'Léa', html: 'même pas proche 😭', tb: [12.6, 'HA<br>HA', 'r'] },
  { at: 18.5, br: 'B', who: 'Vous', raw: share('0:38'), tb: [19.7, '<span style="font-size:44px;color:#ff375f">♥</span>'] },
  { at: 19.1, br: 'B', who: 'Vous', html: '😌', jumbo: true },
  { at: 20.3, br: 'B', who: 'Léa', html: 'NON 😭😭' },
  { at: 21.0, br: 'B', who: 'Malik', html: 't’as triché ??' },
  { at: 21.7, br: 'B', who: 'Vous', html: 'non. CNSNN tous les jours 😌', lu: true },
];
let prevWho = null;
T.forEach(m => {
  const el = document.createElement('div'); el.className = 'm' + (m.who === 'Vous' ? ' me' : '');
  if (m.ts) { el.innerHTML = `<div class="ts">${m.ts}</div>`; prevWho = null; }
  else {
    const name = m.who !== 'Vous' && prevWho !== m.who ? `<div class="nm">${m.who}</div>` : '';
    const body = m.typing ? '<div class="b typing"><i></i><i></i><i></i></div>' : m.raw ? m.raw : `<div class="b${m.jumbo ? ' jumbo' : ''}" ${m.jumbo ? 'style="background:none"' : ''}>${m.html}</div>`;
    const av = m.who !== 'Vous' ? `<div class="av" style="background:${AV[m.who]};${m.noAv ? 'visibility:hidden' : ''}">${m.who[0]}</div>` : '';
    el.innerHTML = `<div class="mi">${av}<div class="col">${name}<div style="position:relative">${body}${m.tb ? `<div class="tb ${m.tb[2] || ''}">${m.tb[1]}</div>` : ''}</div></div></div>${m.lu ? '<div class="lu">Lu à 22:47</div>' : ''}`;
    if (!m.typing) prevWho = m.who;
  }
  $('list').appendChild(el); m.el = el; m.inner = el.firstElementChild; m.tbEl = el.querySelector('.tb'); m.luEl = el.querySelector('.lu');
});
// Name labels for Malik/Léa after Vous's message in timeline A must reappear; handled by prevWho above (Vous resets runs).

// iOS-style keyboard (AZERTY, dark)
const KR = ['azertyuiop', 'qsdfghjklm', 'wxcvbn'];
const KEYS = {};
KR.forEach((r, i) => { const row = document.createElement('div'); row.className = 'kr';
  if (i === 2) row.innerHTML += '<div class="k f" style="width:130px">⇧</div>';
  [...r].forEach(c => { const k = document.createElement('div'); k.className = 'k'; k.textContent = c; KEYS[c] = k; row.appendChild(k); });
  if (i === 2) row.innerHTML += '<div class="k f" style="width:88px">’</div><div class="k f" style="width:130px">⌫</div>';
  $('kb').appendChild(row); });
const last = document.createElement('div'); last.className = 'kr';
last.innerHTML = '<div class="k f" style="width:200px">123</div><div class="k f" style="width:110px">🙂</div><div class="k" style="width:440px;font-size:42px" id="space">espace</div><div class="k f" style="width:200px">envoyer</div>';
$('kb').appendChild(last);
document.querySelectorAll('#kb .kr').forEach(r => { r.querySelectorAll('.k').forEach(k => { if (k.id !== 'space' && !k.classList.contains('f')) {} }); });
// KEYS refs were lost by innerHTML on row 3: rebind
document.querySelectorAll('#kb .k').forEach(k => { if (k.textContent.length === 1 && /[a-z]/.test(k.textContent)) KEYS[k.textContent] = k; });
const TYPED = 'chocolat', TYPE0 = 7.25, TSTEP = 0.27, SEND = 9.7;

// CNSNN app keyboard (glass AZERTY, gold vowels)
const AKEYS = {};
['AZERTYUIOP', 'QSDFGHJKLM', 'WXCVBN'].forEach((r, i) => { const row = document.createElement('div'); row.className = 'row';
  [...r].forEach(c => { const k = document.createElement('div'); k.className = 'key' + (isVowel(c) ? ' vk' : ''); k.textContent = c; AKEYS[c] = k; row.appendChild(k); });
  if (i === 2) { const d = document.createElement('div'); d.className = 'key'; d.style.width = '182px'; d.textContent = '⌫'; row.appendChild(d); }
  $('akb').appendChild(row); });
$('akb').insertAdjacentHTML('beforeend', '<div class="pill gold-fill" id="avalid">Valider</div>');
const AW = [{ w: 'CITRON', t0: 15.45 }, { w: 'BRIOCHE', t0: 16.95 }];

// Camera keys: t, scale, rotX, rotY, rotZ, focusX, focusY (screen px)
const CAM = [
  [0.0, 0.5, 52, 0, -18, 540, 1168], [1.15, 0.58, 38, 0, -11, 540, 1168], [1.9, 1.06, 10, -9, -3, 545, 1420],
  [6.4, 1.12, 12, -6, -2, 545, 1560], [7.05, 1.9, 26, -14, -6, 470, 1450], [9.9, 1.98, 22, -10, -5, 520, 1430],
  [10.55, 1.08, 8, 5, 2, 545, 900], [13.45, 1.12, 9, 4, 2, 545, 920],
  [14.3, 1.12, 12, -6, -2, 545, 1560], [15.2, 1.0, 8, -10, -3, 540, 1020], [17.95, 1.05, 6, -4, -1, 540, 1040],
  [18.3, 1.06, 10, -6, -2, 545, 1500], [23.2, 1.14, 8, 4, 1, 545, 1600],
];
function cam(t) {
  if (t <= CAM[0][0]) return CAM[0].slice(1);
  for (let i = 0; i < CAM.length - 1; i++) { const a = CAM[i], b = CAM[i + 1];
    if (t <= b[0]) { const p = io(prog(t, a[0], b[0])); return a.slice(1).map((v, j) => lerp(v, b[j + 1], p)); } }
  return CAM[CAM.length - 1].slice(1);
}
let H = [], AWL = [], ENDM;
window.setup = async () => {
  await document.fonts.ready;
  $('viewport').style.bottom = '400px';
  T.forEach(m => { m.el.style.height = ''; m.h = m.el.offsetHeight; });
  AW.forEach(a => { const d = document.createElement('div'); d.style.position = 'absolute'; d.style.left = 0; d.style.right = 0; $('aword').appendChild(d); a.d = d; a.L = buildWord(d, a.w); measure(a.L); });
  fitFont($('endMark'), 'CONSONNE', 900); ENDM = buildWord($('endMark'), 'CONSONNE'); measure(ENDM);
  return true;
};

window.render = (t) => {
  // Timeline: A until 13.5, rewind 13.5–14.3 (tau runs back to 6.5), "Et si…" 14.3–15.2, app 15.2–18.2, B after.
  let tau = t, br = 'A';
  if (t >= 13.5 && t < 14.3) tau = 13.5 - (t - 13.5) / 0.8 * 7.0;
  else if (t >= 14.3 && t < 18.2) tau = 6.5;
  if (t >= 14.3) br = 'B';
  const camT = (t >= 13.5 && t < 14.3) ? tau : t;
  const [s, rx, ry, rz, fx, fy] = cam(camT);
  const ph = $('phone');
  ph.style.transformOrigin = `${fx}px ${fy}px`;
  ph.style.transform = window.SCREEN ? 'none' : `translate(${540 - fx}px, ${960 - fy}px) rotateZ(${rz}deg) rotateX(${rx}deg) rotateY(${ry}deg) scale(${s})`;
  if (window.SCREEN) { ph.style.borderRadius = '0'; ph.style.boxShadow = 'none'; $('screen').style.borderRadius = '0'; ph.style.filter = ''; }
  ph.style.filter = (t >= 13.5 && t < 14.3) ? 'blur(2px) saturate(.6) contrast(1.1)' : '';

  // Lock screen → chat (tap the notification)
  const unlock = ease(prog(t, 1.25, 1.65));
  set($('lock'), 1 - unlock, `scale(${1 + 0.06 * unlock})`);
  const ni = spring(t - 0.15, 0.45, 0.7);
  $('notif').style.transform = `translateY(${(1 - ni) * -200}px) scale(${lerp(0.9, 1, clamp(ni))})`; $('notif').style.opacity = clamp(ni * 1.5);
  $('clock').textContent = t < 9 ? '22:46' : '22:47';

  // Keyboard (only while typing in timeline A)
  const kbShow = br === 'A' ? ease(prog(tau, 6.55, 6.85)) * (1 - ease(prog(tau, 13.0, 13.3)) * 0) : 0;
  const kbY = 2337 - 960 * kbShow;
  $('kb').style.top = (2337 - 960 * kbShow + (kbShow < 0.01 ? 40 : 0)) + 'px';
  const inBottom = lerp(2337 - 70, kbY, kbShow);
  $('inputbar').style.top = (inBottom - 150) + 'px';
  $('viewport').style.bottom = (2337 - (inBottom - 150)) + 'px';

  // Thread messages
  T.forEach(m => {
    const vis = (m.br === 'both' || m.br === br) && tau >= m.at && !(m.until && tau >= m.until);
    const p = m.at < 0 ? 1 : ease(prog(tau, m.at, m.at + 0.28));
    m.el.style.display = vis ? '' : 'none';
    m.el.style.height = (m.h * p) + 'px';
    const sp = m.at < 0 ? 1 : spring(tau - m.at, 0.35, 0.72);
    m.inner.style.transformOrigin = m.who === 'Vous' ? '100% 100%' : '0 100%';
    m.inner.style.transform = `scale(${lerp(0.7, 1, sp)})`; m.inner.style.opacity = clamp(sp * 2);
    if (m.tbEl) { const q = spring(tau - m.tb[0], 0.35, 0.55); m.tbEl.style.transform = `scale(${Math.max(0, q)})`; m.tbEl.style.opacity = tau >= m.tb[0] ? 1 : 0; }
    if (m.luEl) m.luEl.style.opacity = tau >= m.at + 0.6 ? 1 : 0;
  });
  // Only the latest "Lu" stays visible
  const shownLu = T.filter(m => m.luEl && m.el.style.display !== 'none' && tau >= m.at + 0.6);
  shownLu.forEach((m, i) => { if (i < shownLu.length - 1) m.luEl.style.opacity = 0; });

  // Typing in the field
  const n = br === 'A' ? TYPED.length - TYPED.split('').filter((_, i) => tau < TYPE0 + i * TSTEP).length : 0;
  const sent = br === 'A' && tau >= SEND;
  const shown = sent ? '' : TYPED.slice(0, n);
  $('typed').textContent = shown;
  $('ph').style.display = shown ? 'none' : '';
  $('caret').style.display = kbShow > 0.5 && Math.floor(t * 2.2) % 2 === 0 ? '' : 'none';
  $('send').style.display = shown ? 'flex' : 'none'; $('mic').style.display = shown ? 'none' : '';
  Object.values(KEYS).forEach(k => { const p = k.querySelector('.pop'); if (p) p.remove(); });
  if (br === 'A' && !sent) TYPED.split('').forEach((c, i) => { const d = tau - (TYPE0 + i * TSTEP);
    if (d >= -0.02 && d < 0.17 && KEYS[c]) { const pop = document.createElement('div'); pop.className = 'pop'; pop.textContent = c; KEYS[c].appendChild(pop); } });
  const sendP = Math.exp(-Math.pow((tau - SEND) / 0.06, 2));
  $('send').style.transform = `scale(${1 - 0.15 * sendP})`;

  // CNSNN app 15.2–18.2 (slides in like an app switch)
  const appIn = io(prog(t, 15.05, 15.4)), appOut = io(prog(t, 18.0, 18.35));
  const appOn = t >= 15.05 && t < 18.35;
  $('app').style.display = appOn ? '' : 'none';
  $('app').style.transform = `translateX(${(1 - appIn) * 1080 - appOut * 1080}px)`;
  $('chat').style.transform = `translateX(${appOn ? (-appIn + appOut) * 1080 * (t < 18 ? 1 : 1) : 0}px)`;
  if (appOn) {
    let typedA = '';
    set($('aok'), 0);
    AW.forEach((a, i) => {
      const lt = t - a.t0, on = lt >= 0 && (i === AW.length - 1 || t < AW[i + 1].t0);
      a.d.style.display = on ? '' : 'none'; if (!on) return;
      const nT = clamp(Math.floor(lt / 0.13) + 1, 0, a.w.length);
      typedA = a.w.slice(0, nT);
      const done = a.t0 + a.w.length * 0.13 + 0.12;
      reveal(a.L, j => spring(t - done - j * 0.08, 0.32, 0.65));
      a.d.style.transform = `scale(${lerp(1.12, 1, ease(clamp(lt / 0.2)))})`;
      const ok = spring(t - done - 0.2, 0.3, 0.6); set($('aok'), clamp(ok), `scale(${ok})`);
      if (t > done) typedA = '';
      Object.values(AKEYS).forEach(k => { k.style.transform = ''; k.style.filter = ''; });
      const ki = Math.floor(lt / 0.13); const kd = lt - ki * 0.13;
      if (ki < a.w.length && kd < 0.1) { const k = AKEYS[a.w[ki]]; k.style.transform = 'scale(.88)'; k.style.filter = 'brightness(1.6)'; }
      $('acombo').textContent = 'combo ×' + (i === 0 ? (t > done + 0.2 ? 5 : 4) : 5);
    });
    $('aans').innerHTML = typedA.split('').map(c => `<span style="color:${isVowel(c) ? '#ffc65a' : '#f4f5f8'}">${c}</span>`).join('') || '<span class="italic" style="color:rgba(244,245,248,.56);font-size:60px;letter-spacing:0">votre réponse</span>';
    $('achrono').textContent = '1:' + String(12 - Math.floor((t - 15.2) * 1.3)).padStart(2, '0');
  }

  // Rewind overlay
  const rwOn = t >= 13.5 && t < 15.2;
  set($('rw'), rwOn ? 1 - prog(t, 15.0, 15.2) : 0);
  $('rw').style.background = `rgba(0,0,0,${0.55 * ease(prog(t, 14.25, 14.5))})`;
  const ic = spring(t - 13.5, 0.3, 0.6);
  $('rwIcon').style.transform = `scale(${ic * (1 + 0.06 * Math.sin(t * 20))})`;
  set($('etsi'), ease(prog(t, 14.35, 14.6)));

  // End card 23.3+
  set($('end'), t >= 23.3 ? 1 : 0);
  const line = 'Zéro voyelle, zéro pitié.';
  let txt = '';
  if (t < 25.3) txt = line.slice(0, Math.floor(clamp((t - 23.45) / 1.0) * line.length));
  else txt = line.slice(0, Math.max(0, line.length - Math.floor((t - 25.3) / 0.3 * line.length)));
  const caretOn = Math.floor(t * 2.5) % 2 === 0 || (t > 23.45 && t < 24.5) || (t > 25.3 && t < 25.6);
  $('endTxt').innerHTML = `${txt}<span id="endCaret" style="opacity:${t < 25.75 && caretOn ? 1 : 0}"></span>`;
  set($('endTxt'), t < 25.75 ? 1 : 0);
  const em = t >= 25.75 ? 1 : 0;
  set($('endMark'), em, `scale(${lerp(1.1, 1, ease(prog(t, 25.75, 26.1)))})`);
  reveal(ENDM, i => spring(t - (26.3 + i * 0.16)));
  const es = ease(prog(t, 27.0, 27.4));
  set($('endSub'), es, `translateY(${(1 - es) * 20}px)`);
  $('vig').style.opacity = t >= 23.3 ? 0 : 1;
  $('grain').style.transform = `translate(${(Math.floor(t * 30) * 37) % 50 - 25}px, ${(Math.floor(t * 30) * 53) % 50 - 25}px)`;
  document.querySelectorAll('.typing i').forEach((d, k) => { d.style.opacity = 0.35 + 0.6 * Math.max(0, Math.sin(t * 7 - k * 0.9)); });
  return true;
};
</script>
