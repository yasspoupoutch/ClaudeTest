<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CNSNN brag — défi</title>
<link rel="stylesheet" href="base.css">
<style>
/* Chat */
#chat { inset: 0; }
#header { left: 40px; right: 40px; top: 150px; height: 170px; border-radius: 85px; display: flex; align-items: center; padding: 0 40px; gap: 28px; z-index: 2; }
#stack { display: flex; }
#stack div { width: 84px; height: 84px; border-radius: 50%; margin-left: -22px; border: 4px solid #15162a; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; color: #0b0c10; }
#stack div:first-child { margin-left: 0; }
#gname b { display: block; font-size: 44px; font-weight: 700; }
#gname span { display: block; font-size: 30px; color: var(--fg3); }
#viewport { left: 0; right: 0; top: 340px; height: 1230px; overflow: hidden; }
#list { position: absolute; left: 50px; right: 50px; top: 30px; display: flex; flex-direction: column; gap: 22px; }
.msg { display: flex; flex-direction: column; max-width: 800px; transform-origin: 0 100%; }
.msg.me { align-self: flex-end; align-items: flex-end; transform-origin: 100% 100%; }
.who { font-size: 28px; font-weight: 700; margin: 0 0 8px 24px; }
.bub { font-size: 46px; line-height: 1.25; padding: 26px 38px; border-radius: 48px; background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.1); }
.me .bub { background: linear-gradient(var(--gold-top), var(--gold-bot)); color: var(--on-gold); border: none; font-weight: 500; }
.typing { display: flex; gap: 12px; padding: 34px 40px; }
.typing i { width: 18px; height: 18px; border-radius: 50%; background: var(--on-gold); opacity: .5; }
/* ShareCard from HomeView.swift (360x450 pt, x1.55) */
.share { width: 558px; height: 698px; border-radius: 40px; padding: 52px; display: flex; flex-direction: column; align-items: center;
  background: linear-gradient(var(--bg-top), var(--bg)); border: 2px solid rgba(255,255,255,.14); box-shadow: 0 30px 60px rgba(0,0,0,.35); }
.share .mark { font-size: 50px; }
.share .ttl { font-size: 20px; font-weight: 700; letter-spacing: 2.5px; color: var(--fg2); margin-top: 16px; }
.share .cons { font-size: 128px; letter-spacing: 6px; margin-top: auto; line-height: 1; }
.share .cap { width: 68px; height: 6px; border-radius: 3px; background: var(--gold); margin-top: 28px; }
.share .out { font-size: 33px; font-weight: 600; color: var(--mint); margin-top: 28px; }
.share .q { font-size: 33px; color: var(--gold); margin-top: auto; }
.link { width: 640px; border-radius: 48px; overflow: hidden; background: rgba(255,255,255,.1); border: 2px solid rgba(255,198,90,.4); }
.link .top { padding: 30px 36px 10px; font-size: 26px; font-weight: 800; letter-spacing: 4px; color: var(--gold); }
.link .code { padding: 0 36px; font-size: 88px; font-family: "Instrument Serif", serif; letter-spacing: 8px; }
.link .sub { padding: 6px 36px 24px; font-size: 32px; color: var(--fg2); }
.link .go { margin: 0 24px 24px; height: 100px; font-size: 38px; font-weight: 700; }
.board { width: 700px; border-radius: 48px; padding: 30px 34px 22px; background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.14); }
.board .top { font-size: 26px; font-weight: 800; letter-spacing: 4px; color: var(--gold); margin-bottom: 14px; }
.brow { display: flex; align-items: center; height: 92px; padding: 0 22px; border-radius: 34px; font-size: 40px; font-weight: 600; }
.brow .rk { width: 52px; color: var(--fg3); font-weight: 700; }
.brow .nm { flex: 1; } .brow .tm { font-variant-numeric: tabular-nums; font-weight: 700; }
.brow.me { background: rgba(255,198,90,.16); color: var(--gold); }
#inputbar { left: 40px; right: 40px; top: 1600px; height: 120px; border-radius: 60px; display: flex; align-items: center; padding: 0 44px; font-size: 38px; color: var(--fg3); }

/* Flash + run + punches */
#flash { inset: 0; background: linear-gradient(var(--gold-top), var(--gold-bot)); display: flex; align-items: center; justify-content: center; }
#flash .mark { color: var(--on-gold); font-size: 190px; text-align: center; line-height: .95; }
#run { inset: 0; }
#runChrono { left: 50%; top: 190px; height: 110px; padding: 0 48px; transform: translateX(-50%); font-size: 50px; font-weight: 700; font-variant-numeric: tabular-nums; }
#runKick { top: 380px; font-size: 34px; font-weight: 800; letter-spacing: 9px; color: var(--gold); }
#runWord { left: 0; right: 0; top: 700px; text-align: center; font-size: 250px; line-height: 1; white-space: nowrap; }
#runOk { left: 50%; top: 1060px; width: 150px; height: 150px; margin-left: -75px; border-radius: 50%; background: rgba(90,230,198,.16); border: 3px solid var(--mint); display: flex; align-items: center; justify-content: center; }
#dots { left: 0; right: 0; top: 1330px; display: flex; justify-content: center; gap: 30px; }
#dots i { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.14); }
.punch { inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
.punch .mark { font-size: 150px; line-height: 1.02; }
/* Outro */
#mark { left: 0; right: 0; top: 640px; text-align: center; }
#mark .v { text-shadow: 0 0 40px rgba(255,198,90,.55); }
#markGlow { left: 40px; right: 40px; top: 550px; height: 420px; background: radial-gradient(closest-side, rgba(255,198,90,.35), rgba(255,198,90,0)); }
#tag { top: 980px; font-size: 100px; color: var(--gold); }
#ps { left: 140px; top: 1240px; }
#ps .bub { font-size: 60px; padding: 32px 46px; }
#ps .who { font-size: 34px; }
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="b1"></div><div class="blob" id="b2"></div>

  <div id="chat" class="abs">
    <div id="viewport" class="abs"><div id="list"></div></div>
    <div id="header" class="abs glass">
      <div id="stack"></div>
      <div id="gname"><b>Les cousins 🏆</b><span>Léa, Malik, Inès, Tom, vous</span></div>
    </div>
    <div id="inputbar" class="abs glass">Message…</div>
  </div>

  <div id="flash" class="abs"><div class="mark">DÉFI<br>LANCÉ</div></div>

  <div id="run" class="abs">
    <div id="runChrono" class="abs glass pill">0:00</div>
    <div id="runKick" class="abs center-x">DÉFI · MOT 1/5</div>
    <div id="runWord" class="abs serif"></div>
    <div id="runOk" class="abs"><svg viewBox="0 0 24 24" width="90" height="90"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#5ae6c6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div id="dots" class="abs"><i></i><i></i><i></i><i></i><i></i></div>
  </div>

  <div id="p1" class="abs punch" style="background:var(--bg)"><div class="mark">UN MOT<br><span style="color:var(--gold)">PAR JOUR.</span></div></div>
  <div id="p2" class="abs punch gold-fill"><div class="mark">LE MÊME<br>POUR TOUS.</div></div>
  <div id="p3" class="abs punch" style="background:var(--bg)"><div class="mark">VOS AMIS<br><span style="color:var(--gold)">À BATTRE.</span></div></div>

  <div id="outro" class="abs" style="inset:0">
    <div class="abs" id="markGlow"></div>
    <div class="abs mark" id="mark"></div>
    <div class="abs center-x italic" id="tag">Défiez vos amis.</div>
    <div class="abs msg" id="ps"><div class="who" style="color:#f3b94c">Léa</div><div class="bub">c’était CH<span class="v">OU</span>CR<span class="v">OU</span>T<span class="v">E</span> 💀</div></div>
  </div>
</div>
<script src="lib.js"></script>
<script>
const AV = { 'Léa': '#f3b94c', 'Malik': '#49d9b9', 'Inès': '#aa99ff', 'Tom': '#f28abd', 'Vous': '#5dc0f6' };
['Léa', 'Malik', 'Inès', 'Tom'].forEach(n => { const d = document.createElement('div'); d.style.background = AV[n]; d.textContent = n[0]; $('stack').appendChild(d); });

const shareCard = `<div class="share"><div class="mark">C<span class="v">O</span>NS<span class="v">O</span>NN<span class="v">E</span></div>
  <div class="ttl">MOT DU JOUR · 2026-10-20</div><div class="cons serif">CHCRT</div><div class="cap"></div>
  <div class="out">Trouvé en 0:41</div><div class="q italic">Trouverez-vous les voyelles ?</div></div>`;
const linkCard = `<div class="link"><div class="top">DÉFI CNSNN</div><div class="code">K7Q2XM</div>
  <div class="sub">5 mots sans leurs voyelles. Le plus rapide gagne.</div><div class="pill gold-fill go">Rejoindre le défi</div></div>`;
const boardCard = `<div class="board"><div class="top">DÉFI K7Q2XM · RÉSULTATS</div>
  <div class="brow me"><span class="rk">1</span><span class="nm">Vous 👑</span><span class="tm">0:38</span></div>
  <div class="brow"><span class="rk">2</span><span class="nm">Léa</span><span class="tm">0:52</span></div>
  <div class="brow"><span class="rk">3</span><span class="nm">Malik</span><span class="tm">1:20</span></div></div>`;
// [time, who, html, raw]
const MSGS = [
  [0.0, 'Léa', shareCard, true],
  [1.0, 'Léa', '0:41. Battez ça 😏'],
  [2.0, 'Malik', 'CHCRT ??? 😭'],
  [2.65, 'Inès', 'chocolat ? non attends'],
  [3.3, 'Tom', 'j’abandonne'],
  [4.0, 'Léa', 'pas de spoil 🤫'],
  [4.7, 'Vous', '<div class="typing"><i></i><i></i><i></i></div>', true, 5.35],
  [5.35, 'Vous', 'Défi. 5 mots sans voyelles.<br>Le plus rapide gagne.'],
  [6.0, 'Vous', linkCard, true],
  [11.6, 'Vous', boardCard, true],
  [12.45, 'Léa', 'NON 😭😭'],
  [13.0, 'Malik', 'revanche demain.'],
  [13.55, 'Tom', 'j’abandonne (encore)'],
];
let prev = null;
const msgEls = MSGS.map(([tm, who, html, raw, until]) => {
  const m = document.createElement('div'); m.className = 'msg' + (who === 'Vous' ? ' me' : '');
  const showName = who !== 'Vous' && (!prev || prev !== who);
  m.innerHTML = (showName ? `<div class="who" style="color:${AV[who]}">${who}</div>` : '') + (raw && !html.includes('typing') ? html : `<div class="bub">${html}</div>`);
  $('list').appendChild(m); prev = who; return { el: m, t: tm, until };
});
let OUT, SCROLL = [];
const RUN = [['FRAISE'], ['CITRON'], ['BRIOCHE'], ['QUICHE'], ['MACARON']];
let RW = [];
window.setup = async () => {
  await document.fonts.ready;
  // Scroll steps: keep the newest message above the input bar
  // The typing bubble is replaced in place by the next message, so measure the thread without it.
  const H = 1210; let last = 0;
  const typing = msgEls.find(m => m.until);
  const typingH = typing.el.offsetHeight;
  typing.el.style.display = 'none';
  let prevBottom = 0;
  msgEls.forEach((m, i) => {
    const bottom = m.until ? prevBottom + 22 + typingH : m.el.offsetTop + m.el.offsetHeight;
    if (!m.until) prevBottom = bottom;
    const target = Math.max(last, bottom - H); SCROLL.push(target - last); last = target; });
  typing.el.style.display = '';
  RW = RUN.map(([w]) => { const d = document.createElement('div'); d.style.position = 'absolute'; d.style.left = 0; d.style.right = 0; $('runWord').appendChild(d);
    const L = buildWord(d, w); measure(L); return { d, L }; });
  fitFont($('mark'), 'CONSONNE', 940); OUT = buildWord($('mark'), 'CONSONNE'); measure(OUT);
  return true;
};

window.render = (t) => {
  ambient(t, 0.5);
  // ---- Chat (0–7.6 and 11.6–14.3) ----
  const chatOn = t < 7.6 || (t >= 11.6 && t < 14.3);
  set($('chat'), chatOn ? 1 : 0);
  let scroll = 0;
  msgEls.forEach((m, i) => {
    const p = spring(t - m.t, 0.38, 0.7);
    const gone = m.until && t >= m.until;
    m.el.style.display = gone ? 'none' : '';
    set(m.el, t >= m.t && !gone ? clamp(p * 1.5) : 0, `scale(${lerp(0.82, 1, p)})`);
    scroll += SCROLL[i] * ease(prog(t, m.t, m.t + 0.35));
  });
  // Typing dots
  document.querySelectorAll('.typing i').forEach((d, k) => { d.style.opacity = 0.35 + 0.55 * Math.max(0, Math.sin((t * 6 - k * 0.9))); });
  $('list').style.transform = `translateY(${-scroll}px)`;
  // Hook: the share card lands big, then settles into the thread
  const card = msgEls[0].el.querySelector('.share');
  const hk = ease(prog(t, 0.55, 1.05));
  card.style.transformOrigin = '0 0';
  card.style.transform = `translate(${lerp(110, 0, hk)}px, ${lerp(40, 0, hk)}px) scale(${lerp(1.3, 1, hk)})`;

  // ---- Flash ----
  const fl = t >= 7.6 && t < 8.5;
  set($('flash'), fl ? 1 : 0, `scale(${fl ? lerp(1.25, 1, ease(prog(t, 7.6, 7.9))) : 1})`);

  // ---- Speed run (8.5–11.6) ----
  const runOn = t >= 8.5 && t < 11.6;
  set($('run'), runOn ? 1 : 0);
  const k = clamp(Math.floor((t - 8.5) / 0.6), 0, 4), lt = t - 8.5 - k * 0.6;
  $('runChrono').textContent = '0:' + String(Math.floor(clamp((t - 8.5) / 3.0) * 38)).padStart(2, '0');
  $('runKick').textContent = `DÉFI · MOT ${k + 1}/5`;
  RW.forEach((w, i) => { const on = i === k; set(w.d, on ? 1 : 0, on ? `scale(${lerp(1.3, 1, ease(clamp(lt / 0.15)))})` : '');
    if (on) reveal(w.L, j => spring(lt - 0.17 - j * 0.05, 0.3, 0.7)); });
  const okp = spring(lt - 0.34, 0.3, 0.6);
  set($('runOk'), clamp(okp), `scale(${okp})`);
  [...$('dots').children].forEach((d, i) => { const done = i < k || (i === k && lt > 0.34);
    d.style.background = done ? 'var(--mint)' : 'rgba(255,255,255,.14)'; });

  // ---- Punch lines (14.3–17.6) ----
  [[$('p1'), 14.3], [$('p2'), 15.4], [$('p3'), 16.5]].forEach(([el, a]) => {
    const on = t >= a && t < a + 1.1; set(el, on ? 1 : 0); el.firstElementChild.style.transform = `scale(${lerp(1.18, 1, ease(prog(t, a, a + 0.25)))})`; });

  // ---- Outro (17.6–21.5) ----
  set($('outro'), t >= 17.6 ? 1 : 0);
  const mk = ease(prog(t, 17.6, 18.0));
  set($('mark'), mk, `scale(${lerp(1.12, 1, mk)})`);
  reveal(OUT, i => spring(t - (18.3 + i * 0.16)));
  set($('markGlow'), ease(prog(t, 18.7, 19.1)) * (0.6 + 0.4 * (1 - prog(t, 19.1, 20.5))));
  const tg = ease(prog(t, 18.9, 19.3));
  set($('tag'), tg, `translateY(${(1 - tg) * 30}px)`);
  const ps = spring(t - 19.7, 0.38, 0.7);
  set($('ps'), t >= 19.7 ? clamp(ps * 1.5) : 0, `scale(${lerp(0.82, 1, ps)})`);
  return true;
};
</script>
</body>
</html>
