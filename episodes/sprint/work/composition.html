<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CNSNN — Sprint</title>
<link rel="stylesheet" href="base.css">
<style>
#game { left: 120px; top: 290px; width: 840px; height: 1493px; border-radius: 46px; overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 0 3px rgba(255,255,255,.12); }
#game img { width: 100%; height: 100%; display: block; }
#banner { left: 50%; top: 150px; height: 104px; padding: 0 40px; transform: translateX(-50%); font-size: 38px; font-weight: 800; letter-spacing: 3px; }
#banner b { color: var(--gold); margin: 0 10px; }
#dim { inset: 0; background: rgba(6,7,12,.72); }
#h1 { top: 640px; font-family: "Fraunces", serif; font-weight: 900; font-size: 128px; line-height: 1; }
#h1 b { color: var(--gold); font-weight: 900; }
#h2 { top: 900px; font-size: 88px; }
#h3 { top: 1080px; font-size: 64px; color: var(--gold); }
#cap { left: 80px; right: 80px; top: 1580px; display: flex; justify-content: center; }
#cap span { padding: 18px 30px; border-radius: 26px; background: rgba(6,7,12,.82); font-size: 50px; font-weight: 800; line-height: 1.2; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
#cap span i { font-style: normal; color: var(--gold); }
.pop { left: 0; right: 0; text-align: center; font-family: "Fraunces", serif; font-weight: 900; text-shadow: 0 10px 40px rgba(0,0,0,.7); }
#combo { top: 780px; font-size: 140px; white-space: nowrap; color: var(--gold); }
#vite { top: 760px; font-size: 190px; color: var(--red); }
#score { top: 420px; }
#score b { font-family: "Fraunces", serif; font-weight: 900; font-size: 230px; color: var(--fg); }
#score span { font-family: "Fraunces", serif; font-weight: 900; font-size: 130px; color: var(--gold); }
#end { inset: 0; background: radial-gradient(1200px 1000px at 50% 30%, #2a1f6b 0%, #0b0c14 70%); }
#eicon { left: 50%; top: 330px; width: 230px; height: 230px; margin-left: -115px; border-radius: 52px; box-shadow: 0 30px 60px rgba(0,0,0,.5); }
#e1 { top: 640px; font-family: "Fraunces", serif; font-weight: 900; font-size: 112px; line-height: 1.02; }
#e1 b { color: var(--gold); }
#e2 { top: 920px; font-size: 64px; color: var(--fg2); }
#store { left: 50%; top: 1060px; transform: translateX(-50%); height: 130px; padding: 0 44px 0 32px; border-radius: 30px; background: #000; border: 3px solid #a6a6a6; display: flex; align-items: center; gap: 16px; white-space: nowrap; }
#store small { display: block; font-size: 28px; } #store b { display: block; font-size: 58px; font-weight: 600; letter-spacing: -1px; line-height: 1.02; }
#e3 { top: 1260px; font-size: 60px; color: var(--gold); }
#arrow { top: 1370px; font-size: 100px; }
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="b1"></div><div class="blob" id="b2"></div>
  <div class="abs pill glass" id="banner">⚡ SPRINT · 90 S · RECORD <b>18 MOTS</b></div>
  <div class="abs" id="game"><img id="gi" src="g/00001.jpg" alt=""></div>
  <div class="abs" id="dim"></div>
  <div class="abs center-x" id="h1">RECORD :<br><b>18 MOTS</b></div>
  <div class="abs center-x italic" id="h2">en 90 secondes 🔥</div>
  <div class="abs center-x serif" id="h3">Tu fais mieux ?</div>
  <div class="abs pop" id="combo">COMBO ×3 🔥</div>
  <div class="abs pop" id="vite">VITE !</div>
  <div class="abs pop" id="score"><b>7</b><span> / 18</span></div>
  <div class="abs" id="cap"><span id="capt"></span></div>
  <div class="abs" id="end">
    <img class="abs" id="eicon" src="appicon.png" alt="">
    <div class="abs center-x" id="e1">Tu bats<br><b>le record ?</b></div>
    <div class="abs center-x italic" id="e2">Mode Sprint · CNSNN</div>
    <div class="abs" id="store"><svg width="72" height="72" viewBox="0 0 24 24"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701" fill="#fff"/></svg><div><small>Télécharger dans</small><b>l’App Store</b></div></div>
    <div class="abs center-x serif" id="e3">Ton score en commentaire</div>
    <div class="abs center-x" id="arrow">👇</div>
  </div>
</div>
<script src="lib.js"></script>
<script src="tl.js"></script>
<script>
// Captions follow the voice; the key words are in gold.
const CAPS = [
  ['hook', 'Le record du Sprint ? <i>18 mots</i>… en <i>90 secondes</i>.'],
  ['rule', 'Un mot sans voyelles. Tu retrouves, tu valides… <i>le suivant arrive direct.</i>'],
  ['combo', '3 bonnes réponses d’affilée ? <i>Combo ×3 !</i>'],
  ['clock', 'Et le chrono, lui, <i>ne s’arrête jamais.</i>'],
  ['last', 'Dernières secondes… <i>vite !</i>'],
  ['result', '<i>7 mots.</i> Pas mal… mais très loin du record.'],
];
const N = 1271;   // frames of the cut game footage (g/)
const imgs = {};
window.setup = async () => { await document.fonts.ready; return true; };
window.render = async (t) => {
  ambient(t, 0.5);
  // the game footage, frame by frame; a small punch-in on each event
  const f = Math.min(N, Math.floor(t * 30) + 1), src = `g/${String(f).padStart(5, '0')}.jpg`;
  if ($('gi').getAttribute('src') !== src) { $('gi').src = src; await $('gi').decode().catch(() => {}); }
  const punch = ['combo', 'last'].reduce((p, k) => p + 0.05 * Math.exp(-Math.max(0, t - TL[k]) * 4) * (t >= TL[k] ? 1 : 0), 0);
  const zr = ease(prog(t, TL.TR, TL.TR + 0.6));   // zoom on the result card
  $('game').style.transform = `scale(${1 + punch + 0.12 * zr}) translateY(${zr * 60}px)`;
  // hook: dimmed footage, the record in big
  const hk = 1 - prog(t, TL.TH - 0.3, TL.TH);
  set($('dim'), Math.max(hk, ease(prog(t, TL.TR + 0.4, TL.TR + 0.8)) * 0.55 * (t < TL.TE ? 1 : 0)));
  const a = ease(prog(t, 0, 0.3)), b = ease(prog(t, 1.3, 1.6)), c = ease(prog(t, 2.6, 2.9));
  set($('h1'), a * hk, `scale(${lerp(1.2, 1, a)})`); set($('h2'), b * hk, `translateY(${(1 - b) * 30}px)`); set($('h3'), c * hk, `scale(${lerp(0.8, 1, c)})`);
  set($('banner'), t >= TL.TH - 0.2 && t < TL.TE ? 1 : 0, 'translateX(-50%)');
  // pops
  const pop = (el, k, len) => { const s = spring(t - TL[k], 0.35, 0.55); set(el, t >= TL[k] && t < TL[k] + len ? clamp(s * 1.5) * (1 - prog(t, TL[k] + len - 0.3, TL[k] + len)) : 0, `scale(${lerp(0.5, 1, clamp(s))}) rotate(${-4 + 4 * clamp(s)}deg)`); };
  pop($('combo'), 'combo', 1.6); pop($('vite'), 'last', 1.4);
  const sc = spring(t - TL.result, 0.4, 0.6); set($('score'), t >= TL.result && t < TL.TE ? clamp(sc * 1.4) : 0, `scale(${lerp(0.6, 1, clamp(sc))})`);
  // captions
  const cur = CAPS.find(([k]) => t >= TL[k] && t < TL[k] + TL[k + '_d'] + 0.2);
  $('capt').innerHTML = cur ? cur[1] : '';
  set($('cap'), cur && t >= TL.TH - 0.3 ? 1 : 0);
  // end card
  const e = prog(t, TL.TE, TL.TE + 0.3); set($('end'), e);
  const e1 = ease(prog(t, TL.TE + 0.1, TL.TE + 0.45)), e2 = ease(prog(t, TL.cta + 2.0, TL.cta + 2.4)), e3 = ease(prog(t, TL.cta + 3.2, TL.cta + 3.6));
  set($('eicon'), e1, `scale(${lerp(0.6, 1, e1)})`); set($('e1'), e1, `translateY(${(1 - e1) * 40}px)`);
  set($('e2'), e2); set($('store'), e2, `translateX(-50%) scale(${lerp(0.85, 1, e2)})`);
  set($('e3'), e3); set($('arrow'), e3, `translateY(${Math.sin(t * 6) * 14}px)`);
  return true;
};
</script>
</body>
</html>
