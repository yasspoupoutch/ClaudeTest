<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CNSNN textures</title>
<style>
/* Tokens from CNSNN App/DesignSystem/Theme.swift; sizes are SwiftUI points x 3 (1179 x 2556 screen) */
@font-face { font-family: "Fraunces"; font-weight: 900; src: url("../public/fonts/Fraunces-Black.ttf"); }
@font-face { font-family: "Instrument Serif"; font-style: normal; src: url("../public/fonts/InstrumentSerif-Regular.ttf"); }
@font-face { font-family: "Instrument Serif"; font-style: italic; src: url("../public/fonts/InstrumentSerif-Italic.ttf"); }
:root { --fg: #f4f5f8; --fg2: rgba(244,245,248,.64); --fg3: rgba(244,245,248,.56); --gold: #ffc65a; --gold-top: #ffd673; --gold-bot: #f6b84d; --on-gold: #1a1406; --mint: #5ae6c6; --red: #ff8785; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: transparent; }
body { font-family: "Inter", "Noto Color Emoji", sans-serif; color: var(--fg); -webkit-font-smoothing: antialiased; }
.serif { font-family: "Instrument Serif", serif; } .italic { font-family: "Instrument Serif", serif; font-style: italic; }
.mark { font-family: "Fraunces", serif; font-weight: 900; letter-spacing: .02em; }
.v { color: var(--gold); }
.glass { background: linear-gradient(rgba(255,255,255,.14), rgba(255,255,255,.05)); border: 3px solid rgba(255,255,255,.16); box-shadow: inset 0 3px 0 rgba(255,255,255,.2); }
.pill { border-radius: 999px; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
.gold-fill { background: linear-gradient(var(--gold-top), var(--gold-bot)); color: var(--on-gold); }
.abs { position: absolute; }
.hidden { display: none !important; }

/* Phone screen */
#screen { position: relative; width: 1179px; height: 2556px; overflow: hidden;
  background: radial-gradient(800px 800px at 12% 20%, rgba(89,62,199,.55), rgba(89,62,199,0) 70%),
              radial-gradient(800px 800px at 88% 78%, rgba(0,125,134,.5), rgba(0,125,134,0) 70%),
              radial-gradient(1700px 1500px at 50% 0%, #121426, #06070c); }
.status { position: absolute; left: 0; right: 0; top: 0; height: 160px; display: flex; align-items: center; justify-content: space-between; padding: 40px 120px 0 140px; font-size: 52px; font-weight: 600; }
.island { position: absolute; left: 50%; top: 34px; width: 370px; height: 108px; margin-left: -185px; border-radius: 54px; background: #000; }
.bars { display: flex; gap: 6px; align-items: flex-end; } .bars i { width: 11px; background: #fff; border-radius: 3px; }
.bat { width: 82px; height: 40px; border-radius: 12px; border: 3px solid rgba(255,255,255,.5); padding: 4px; } .bat i { display: block; width: 72%; height: 100%; border-radius: 6px; background: #fff; }
.home { position: absolute; left: 50%; bottom: 24px; width: 420px; height: 15px; border-radius: 8px; background: rgba(255,255,255,.85); transform: translateX(-50%); }

/* GameView */
#gclose { left: 48px; top: 205px; width: 108px; height: 108px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
#gtitle { left: 0; right: 0; top: 210px; text-align: center; } #gtitle b { display: block; font-size: 48px; font-weight: 600; } #gtitle span { display: block; font-size: 36px; color: var(--fg3); margin-top: 2px; }
#gchrono { right: 48px; top: 205px; height: 108px; padding: 0 40px; font-size: 42px; font-weight: 700; font-variant-numeric: tabular-nums; }
#gcons { left: 0; right: 0; top: 470px; text-align: center; font-size: 264px; line-height: 1; letter-spacing: 9px; }
#gslot { left: 160px; right: 160px; top: 420px; height: 360px; border-radius: 60px; border: 4px solid rgba(255,198,90,.75); box-shadow: 0 0 60px rgba(255,198,90,.55), inset 0 0 60px rgba(255,198,90,.25); }
#gdiv { left: 535px; width: 110px; height: 5px; top: 830px; background: var(--fg3); }
#gnotice { left: 0; right: 0; top: 900px; text-align: center; font-size: 36px; color: var(--fg3); }
#gans { left: 120px; right: 120px; top: 1180px; height: 168px; border-bottom: 3px solid var(--fg3); display: flex; align-items: center; justify-content: center; }
#gph { font-size: 66px; color: var(--fg3); }
#gtyped span { font-size: 90px; font-weight: 500; letter-spacing: 7px; }
#gcaret { width: 8px; height: 90px; border-radius: 4px; background: var(--fg); margin-left: 6px; }
#gbtns { left: 0; right: 0; top: 1385px; display: flex; justify-content: center; gap: 24px; }
#gbtns .pill { height: 108px; padding: 0 48px; font-size: 39px; font-weight: 500; }
#kb { left: 48px; right: 48px; top: 1540px; height: 720px; border-radius: 90px; padding: 32px 18px; }
.row { display: flex; justify-content: center; gap: 12px; margin-bottom: 24px; }
.key { width: 94px; height: 132px; border-radius: 30px; display: flex; align-items: center; justify-content: center; font-size: 57px; font-weight: 500; background: rgba(255,255,255,.08); border: 3px solid rgba(255,255,255,.16); }
.key.vk { background: linear-gradient(var(--gold-top), var(--gold-bot)); border: none; color: var(--on-gold); }
.key.down { transform: scale(.88); filter: brightness(1.7); }
#kbot { display: flex; gap: 18px; padding: 4px 12px 0; } #kspace { width: 330px; height: 144px; font-size: 44px; }
#valider { flex: 1; height: 144px; font-size: 50px; font-weight: 600; }
#valider.down { transform: scale(.94); filter: brightness(1.15); }
/* Result sheet */
#dim { inset: 0; background: rgba(0,0,0,.42); }
#sheet { left: 24px; right: 24px; bottom: 34px; border-radius: 144px; padding: 80px 66px 72px; display: flex; flex-direction: column; align-items: center;
  background: linear-gradient(rgb(36,38,50), rgb(19,20,27)); border: 3px solid rgba(255,255,255,.16); box-shadow: inset 0 3px 0 rgba(255,255,255,.3); }
#rk { font-size: 72px; color: var(--mint); }
#rword { margin-top: 28px; font-size: 120px; font-weight: 900; letter-spacing: 7px; white-space: nowrap; line-height: 1.15; }
#rword .v { text-shadow: 0 0 34px rgba(255,198,90,.6); }
#rh { margin-top: 18px; font-size: 44px; line-height: 1.3; color: var(--fg2); text-align: center; }
#rtiles { margin-top: 52px; display: flex; gap: 30px; width: 100%; }
#rtiles div { flex: 1; padding: 34px 0; border-radius: 60px; background: rgba(255,255,255,.08); border: 3px solid rgba(255,255,255,.07); text-align: center; }
#rtiles b { display: block; font-size: 66px; font-weight: 700; } #rtiles span { display: block; font-size: 36px; color: var(--fg3); margin-top: 4px; }
#roff { margin-top: 42px; text-align: center; } #roff b { display: block; font-size: 51px; color: var(--mint); } #roff span { display: block; font-size: 39px; color: var(--fg2); margin-top: 4px; }
#rbt { margin-top: 56px; display: flex; gap: 30px; width: 100%; } #rbt .pill { height: 162px; font-size: 51px; font-weight: 600; }
/* Leaderboard */
#lb { inset: 0; padding: 200px 54px 0; }
#lbt { font-size: 102px; font-weight: 800; letter-spacing: -1px; }
#lbsub { font-size: 40px; color: var(--fg2); margin-top: 8px; }
#chips { display: flex; gap: 18px; margin-top: 48px; }
#chips div { height: 96px; padding: 0 40px; border-radius: 48px; display: flex; align-items: center; font-size: 40px; font-weight: 600; color: var(--fg2); background: rgba(255,255,255,.08); }
#chips div.on { background: rgba(255,255,255,.22); color: var(--fg); }
#rows { margin-top: 48px; border-radius: 80px; padding: 26px; }
.lr { display: flex; align-items: center; height: 168px; padding: 0 34px; border-radius: 56px; }
.lr + .lr { margin-top: 10px; }
.lr .rk { width: 76px; font-size: 46px; font-weight: 700; color: var(--fg3); }
.lr .av { width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 700; color: #0b0c10; margin-right: 34px; }
.lr .nm { flex: 1; font-size: 50px; font-weight: 600; } .lr .tm { font-size: 50px; font-weight: 700; font-variant-numeric: tabular-nums; }
.lr.me { background: rgba(255,198,90,.14); border: 3px solid rgba(255,198,90,.4); } .lr.me .nm, .lr.me .tm { color: var(--gold); }
#defier { margin: 56px auto 0; width: 640px; height: 150px; font-size: 50px; font-weight: 700; }

/* Floating cards (3D): ShareCard front/back and mode cards, 900 x 1125 */
.wcard { position: relative; width: 1200px; height: 900px; border-radius: 90px; overflow: hidden; padding: 80px 90px; display: flex; flex-direction: column; align-items: center; background: linear-gradient(#141729, #07080e); }
.card { position: relative; width: 900px; height: 1125px; border-radius: 96px; overflow: hidden; padding: 110px 90px; display: flex; flex-direction: column; align-items: center;
  background: linear-gradient(#141729, #07080e); }
.card .mark { font-size: 96px; }
.card .ttl { font-size: 38px; font-weight: 700; letter-spacing: 5px; color: var(--fg2); margin-top: 26px; }
.card .cap { width: 120px; height: 10px; border-radius: 5px; background: var(--gold); }
.card .q { font-size: 62px; color: var(--gold); margin-top: auto; }
.kick { font-size: 46px; font-weight: 800; letter-spacing: 12px; color: var(--gold); }
</style>
</head>
<body>
<div id="host"></div>
<script>
const isVowel = c => 'AEIOUY'.includes(c);
const statusBar = time => `<div class="status"><span>${time}</span><span style="display:flex;gap:20px;align-items:center"><span class="bars"><i style="height:14px"></i><i style="height:22px"></i><i style="height:30px"></i><i style="height:38px"></i></span><span class="bat"><i></i></span></span></div><div class="island"></div><div class="home"></div>`;
const keyboard = (down, validDown) => {
  const rows = ['AZERTYUIOP', 'QSDFGHJKLM', 'WXCVBN'];
  return `<div id="kb" class="abs glass">${rows.map((r, i) => `<div class="row">${[...r].map(c => `<div class="key${isVowel(c) ? ' vk' : ''}${c === down ? ' down' : ''}">${c}</div>`).join('')}${i === 2 ? '<div class="key" style="width:200px">⌫</div>' : ''}</div>`).join('')}
    <div id="kbot"><div class="key" id="kspace">espace</div><div class="pill gold-fill${validDown ? ' down' : ''}" id="valider">Valider</div></div></div>`;
};
// Mot du jour screen. typed: letters typed so far; down: key pressed; lifted: the consonants left the screen.
function game({ typed = '', down = '', validDown = false, chrono = '0:24', lifted = false, sheet = false }) {
  const t = typed.split('').map(c => `<span style="color:${isVowel(c) ? 'var(--gold)' : 'var(--fg)'}">${c}</span>`).join('');
  return `<div id="screen">
    <div id="gclose" class="abs glass"><svg viewBox="0 0 24 24" width="108" height="108"><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="#f4f5f8" stroke-width="1.6" stroke-linecap="round"/></svg></div>
    <div id="gtitle" class="abs"><b>Mot du jour</b><span>Général · Difficile</span></div>
    <div id="gchrono" class="abs glass pill">${chrono}</div>
    ${lifted ? '<div id="gslot" class="abs"></div>' : '<div id="gcons" class="abs serif">CHCRT</div>'}
    <div id="gdiv" class="abs"></div>
    <div id="gnotice" class="abs">Chrono officiel. 20 essais pour trouver le mot.</div>
    <div id="gans" class="abs">${typed ? `<span id="gtyped">${t}</span>` : '<span id="gph" class="italic">votre réponse</span>'}${sheet ? '' : '<span id="gcaret"></span>'}</div>
    <div id="gbtns" class="abs"><div class="pill glass"><b>Indice</b>&nbsp;&nbsp;+1 min</div><div class="pill glass" style="color:var(--fg2)">Passer</div></div>
    ${keyboard(down, validDown)}
    ${sheet ? `<div id="dim" class="abs"></div><div id="sheet" class="abs">
      <div id="rk" class="italic">Du premier coup, sans indice.</div>
      <div id="rword">CH<span class="v">OU</span>CR<span class="v">OU</span>T<span class="v">E</span></div>
      <div id="rh">« Du chou fermenté servi avec des saucisses, spécialité alsacienne. »</div>
      <div id="rtiles"><div><b>0:38</b><span>temps</span></div><div><b>non</b><span>indice</span></div><div><b>12</b><span>jours de série</span></div></div>
      <div id="roff"><b>Top 3 %</b><span>2e sur 87 aujourd’hui</span></div>
      <div id="rbt"><div class="pill glass" style="flex:1">Partager</div><div class="pill gold-fill" style="flex:1.4">Terminer</div></div></div>` : ''}
    ${statusBar('22:46')}</div>`;
}
function board() {
  const av = ['#f3b94c', '#49d9b9', '#aa99ff', '#f28abd', '#5dc0f6'];
  const rows = [['Vous', '0:38', 4, true], ['Léa', '0:41', 0], ['Malik', '0:58', 1], ['Inès', '1:12', 2], ['Tom', '1:30', 3]];
  return `<div id="screen"><div id="lb" class="abs">
    <div id="lbt">Classement</div><div id="lbsub">Mot du jour · dimanche 18 octobre</div>
    <div id="chips"><div class="on">Aujourd’hui</div><div>Amis</div><div>Mois</div><div>Records</div></div>
    <div id="rows" class="glass">${rows.map(([n, t, a, me], i) => `<div class="lr${me ? ' me' : ''}"><div class="rk">${i + 1}</div><div class="av" style="background:${av[a]}">${n[0]}</div><div class="nm">${n}</div><div class="tm">${t}</div></div>`).join('')}</div>
    <div id="defier" class="pill gold-fill">Défier un ami</div></div>${statusBar('22:47')}</div>`;
}
// The ShareCard (HomeView.swift) as a physical card; its consonants and vowels are 3D text in the scene.
const cardFront = () => `<div class="wcard card-like"><div class="mark" style="font-size:84px">C<span class="v">O</span>NS<span class="v">O</span>NN<span class="v">E</span></div>
  <div style="font-size:34px;font-weight:700;letter-spacing:5px;color:var(--fg2);margin-top:20px">MOT DU JOUR · 2026-10-18</div><div style="flex:1"></div>
  <div style="width:110px;height:9px;border-radius:5px;background:var(--gold)"></div><div class="italic" style="font-size:58px;color:var(--gold);margin-top:44px">Trouverez-vous les voyelles ?</div></div>`;
const cardBack = () => `<div class="wcard" style="justify-content:center">
  <div class="italic" style="font-size:86px;color:var(--mint)">Du premier coup, sans indice.</div>
  <div style="font-size:250px;font-weight:800;letter-spacing:-4px;line-height:1;margin-top:40px">0:38</div>
  <div style="width:300px;height:10px;border-radius:5px;background:var(--gold);margin-top:34px"></div>
  <div style="font-size:60px;font-weight:700;color:var(--mint);margin-top:50px">Top 3 % <span style="color:var(--fg2);font-weight:500">· 2e sur 87 aujourd’hui</span></div></div>`;
const modeCard = kind => {
  if (kind === 'sprint') return `<div class="card"><div class="kick">SPRINT</div>
    <svg width="560" height="560" viewBox="0 0 100 100" style="margin-top:70px"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="4"/><circle cx="50" cy="50" r="44" fill="none" stroke="#ffc65a" stroke-width="4" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="40" transform="rotate(-90 50 50)"/>
    <text x="50" y="60" text-anchor="middle" font-family="Instrument Serif" font-size="34" fill="#f4f5f8">90 s</text></svg>
    <div class="pill gold-fill" style="height:130px;padding:0 60px;font-size:66px;font-weight:800;margin-top:50px">combo ×5</div></div>`;
  if (kind === 'survie') { const h = (c) => `<svg width="190" height="190" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.3 8.4 2.2 4 6.4 4c2.3 0 3.9 1.3 5.6 3.3C13.7 5.3 15.3 4 17.6 4 21.8 4 23.7 8.4 22 11.7 19.5 16.4 12 21 12 21z" fill="${c}"/></svg>`;
    return `<div class="card"><div class="kick">SURVIE</div><div style="display:flex;gap:40px;margin-top:200px">${h('#ff8785')}${h('#ff8785')}${h('rgba(255,255,255,.14)')}</div>
    <div class="pill glass" style="height:120px;padding:0 54px;font-size:50px;font-weight:600;margin-top:110px">Niveau 4</div>
    <div class="serif" style="font-size:88px;margin-top:auto">Trois vies, pas plus.</div></div>`; }
  return `<div class="card"><div class="kick">DOUBLE SENS</div><div class="serif" style="font-size:300px;line-height:1;margin-top:60px;letter-spacing:10px">FRN</div>
    <div style="font-size:150px;font-weight:900;letter-spacing:8px;margin-top:40px">F<span class="v">A</span>R<span class="v">I</span>N<span class="v">E</span></div>
    <div class="italic" style="font-size:90px;color:var(--fg2);margin-top:10px">ou</div>
    <div style="font-size:150px;font-weight:900;letter-spacing:8px;margin-top:10px">FR<span class="v">EI</span>N</div></div>`;
};
window.show = (name, opts = {}) => {
  const html = name === 'game' ? game(opts) : name === 'board' ? board() : name === 'cardFront' ? cardFront() : name === 'cardBack' ? cardBack() : modeCard(opts.kind);
  document.getElementById('host').innerHTML = html;
  return document.fonts.ready.then(() => true);
};
</script>
</body>
</html>
