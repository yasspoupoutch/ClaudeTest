const camX = t => 140 * Math.sin(t * 0.55) * prog(t, 3, 5) * (1 - prog(t, 15, 16.5));
const camY = t => -40 * Math.sin(t * 0.8) * prog(t, 3, 5) * (1 - prog(t, 15, 16.5));
window.passTimes = () => { const zs = { rings: RINGS.map(r => r.z), words: WORDS.map(w => w.z), tombs: OBJ.filter(o => o.d.classList.contains('tomb')).map(o => o.z), sign: [SIGN.z] }, out = {};
  for (const k in zs) out[k] = zs[k].map(z => { for (let t = 0; t < 26; t += 1 / 60) if (camZ(t) <= z) return +t.toFixed(2); return null; }); return out; };

// ================================================================ frame
window.render = (t) => {
  const cz = camZ(t), cx = camX(t), cy = camY(t);
  const vz = (camZ(t + 0.05) - cz) / 0.05;                  // forward speed, px/s (negative)
  const roll = -2.2 * Math.cos(t * 0.55) * prog(t, 3, 5) * (1 - prog(t, 15, 16.5));
  const pitch = lerp(-13, -6, prog(t, 15, 17.2));   // negative = looking down at the road
  // CSS puts the eye at z = +perspective: move it onto the camera so that scale = P / distance
  $('scene').style.transform = `translateZ(${P}px) rotateZ(${roll}deg) rotateX(${pitch}deg) translate3d(${-cx}px, ${-cy}px, ${-cz}px)`;
  // sky: moon and skyline barely move, stars twinkle
  const g = $('stars').getContext('2d'); g.clearRect(0, 0, 1080, 1920);
  stars.forEach(s => { g.globalAlpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph)); g.fillStyle = '#fff'; g.beginPath(); g.arc(s.x - cx * 0.02, s.y, s.r, 0, 7); g.fill(); });
  const hz = 960 + Math.tan(pitch * Math.PI / 180) * P;     // horizon height on screen
  Object.assign($('moon').style, { left: (700 - cx * 0.03) + 'px', top: (hz - 760) + 'px', width: '260px', height: '260px' });
  const grow = 1 + 0.18 * prog(cz, 500, -14500);
  $('skyline').style.top = (hz - 340) + 'px'; $('skyline').style.transform = `translateX(${-cx * 0.05}px) scale(${grow})`;
  $('horizon').style.top = (hz - 180) + 'px';

  // ---- the sign: vowels jump out at 1.2 s, the consonants close ranks
  const gone = ease(prog(t, 1.25, 1.75));
  SIGN_L.forEach(l => { if (l.v) { l.s.style.opacity = 1 - prog(t, 1.2, 1.3); l.s.style.maxWidth = (l.w * (1 - gone)) + 'px'; l.s.style.overflow = 'visible'; } });
  const flick = t > 1.3 && t < 2.2 ? (Math.sin(t * 47) > 0.2 ? 1 : 0.35) : 1;
  SIGN.op = flick;
  // ---- vowels: escape from the sign, giggle, then flee down the road ahead of the camera
  VOW.forEach(v => {
    const fromSign = v.i < 3, l = fromSign ? SIGN_L.filter(s => s.v)[v.i] : null;
    const start = fromSign ? [l.cx, SIGN.y, SIGN.z + 30] : [[-800, 0, 800][v.i - 3], [-500, -300, -450][v.i - 3], -2300 - (v.i - 3) * 200];
    const hover = [(-500 + v.i * 200) + Math.sin(t * 3 + v.ph) * 40, -560 + Math.cos(t * 4 + v.ph) * 40, -1700];
    const lead = 1700 + 300 * Math.sin(t * 1.3 + v.ph) + v.i * 120;
    const chase = [cx + Math.sin(t * 1.7 + v.ph) * 420 + (v.i - 2.5) * 120, -470 + Math.cos(t * 2.1 + v.ph) * 120, cz - lead];
    const pDive = prog(t, 16.9 + v.i * 0.22, 17.5 + v.i * 0.22);          // into the phone screen
    const screen = [PHONE.x + (v.i - 2.5) * 60, PHONE.y - 230, PHONE.z + 20];
    const a = ease(prog(t, 1.2, 2.0)), b = io(prog(t, 2.6, 3.6));
    let p = start.map((s, k) => lerp(s, hover[k], fromSign ? a : ease(prog(t, 1.4 + (v.i - 3) * 0.15, 2.3))));
    p = p.map((s, k) => lerp(s, chase[k], b));
    p = p.map((s, k) => lerp(s, screen[k], io(prog(t, 15.6 + v.i * 0.15, 16.9 + v.i * 0.22))));
    v.x = p[0]; v.y = p[1]; v.z = p[2] + pDive * 0;
    v.op = (fromSign ? 1 : ease(prog(t, 1.4 + (v.i - 3) * 0.15, 1.9 + (v.i - 3) * 0.15))) * (1 - pDive);
    v.rot = `rotateZ(${Math.sin(t * 5 + v.ph) * 14}deg) scale(${lerp(1, 0.25, pDive)})`;
  });
  // ---- bats: a colony crosses the road towards the camera in the middle of the chase
  BATS.forEach((b, i) => { const t0 = 6.2 + (i % 11) * 0.12 + (i > 10 ? 4.6 : 0), p = (t - t0) / 1.8;
    if (p < 0 || p > 1) { b.op = 0; return; } b.op = 1;
    const zz = camZ(t0) - 2600 + p * 2300; b.x = Math.cos(i * 2.4) * lerp(300, 900, p); b.y = -400 + Math.sin(i * 1.7) * 260 - p * 200; b.z = zz;
    const w = Math.sin(t * (10 + i % 4) + b.ph); b.rot = `scale(${b.s})`;
    b.wl.setAttribute('transform', `rotate(${w * 28}) scale(1, ${0.55 + 0.45 * Math.abs(w)})`); b.wr.setAttribute('transform', `scale(-1,1) rotate(${w * 28}) scale(1, ${0.55 + 0.45 * Math.abs(w)})`); });
  PUMPS.forEach(o => { o.d.querySelector('.face').style.opacity = 0.75 + 0.25 * Math.sin(t * 13 + o.ph) * Math.sin(t * 7.3 + o.ph * 2); });
  // ---- rings pulse; words flare as the camera reaches them
  RINGS.forEach(r => { r.rot = `rotateZ(${t * 20}deg)`; });
  WORDS.forEach(w => { const d = cz - w.z; w.rot = `rotateY(${clamp((d - 600) / 3000) * (w.x < 0 ? 20 : -20)}deg)`; });
  // ---- phone: the vowels land, the screen flashes and shows the found word
  const land = prog(t, 16.9, 18.4);
  $('phF').style.opacity = Math.max(...[0, 1, 2, 3, 4, 5].map(i => Math.exp(-Math.pow((t - (17.5 + i * 0.22)) / 0.08, 2)))) * 0.9;
  $('phB').style.opacity = ease(prog(t, 18.3, 18.6));
  PHONE.rot = `rotateY(${lerp(-14, 0, prog(t, 14, 17.5))}deg)`;
  // ---- dive into the screen, flash, end card
  const dive = io(prog(t, 19.0, 20.2));
  if (dive > 0) { const z0 = camZ(18.9); const zz = lerp(z0, PHONE.z + 140, dive);
    $('scene').style.transform = `translateZ(${P}px) rotateX(${lerp(pitch, 0, dive)}deg) translate3d(0px, ${-lerp(0, PHONE.y, dive)}px, ${-zz}px)`; }
  const czEff = dive > 0 ? lerp(camZ(18.9), PHONE.z + 140, dive) : cz;
  OBJ.forEach(o => place(o, czEff, cx));
  $('flashAll').style.opacity = Math.exp(-Math.pow((t - 20.25) / 0.22, 2));
  // speed lines feel: blur the near pumpkins a bit when fast


  // ---- end card 20.25–26
  const e = t >= 20.25; set($('end'), e ? 1 : 0);
  if (e) {
    const mk = ease(prog(t, 20.3, 20.8)); set($('mark'), mk, `scale(${lerp(1.25, 1, mk)})`);
    reveal(OUT, i => spring(t - (21.0 + i * 0.18)));
    $('eline').style.transform = `scaleX(${io(prog(t, 21.2, 21.9))})`;
    $('emoon').style.transform = `translateY(${lerp(80, 0, ease(prog(t, 20.3, 21.3)))}px)`;
    [['tw1', 22.0], ['tw2', 22.35]].forEach(([id, t0]) => { const p = spring(t - t0, 0.45, 0.6); set($(id), clamp(p * 1.5), `translateY(${(1 - p) * 40}px)`); });
    const st = spring(t - 23.0, 0.5, 0.75); set($('store'), clamp(st * 1.4), `translateY(${(1 - st) * 50}px)`);
    const tk = spring(t - 23.3, 0.5, 0.75); set($('tiktok'), clamp(tk * 1.4), `translateY(${(1 - tk) * 40}px)`);
    set($('happy'), ease(prog(t, 23.7, 24.1)));
  }
  return true;
};
</script>
</body>
