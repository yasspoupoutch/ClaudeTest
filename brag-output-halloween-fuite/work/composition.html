CARVED.forEach((w, i) => { const sd = i % 2 ? 1 : -1, z = -5000 - i * 650;
  const o = side(sd * 660, GROUND - 190, z, carvedSVG(440, w), 'carve', { rot: `rotateY(${-sd * 22}deg)` });
  o.d.style.filter = 'drop-shadow(0 0 60px rgba(255,120,20,.6))'; o.ph = rnd() * 6; PUMPS.push(o); });
// lamp posts, dead trees, fog
for (let z = -2200, i = 0; z > -15000; z -= 2100, i++) side((i % 2 ? 1 : -1) * 500, GROUND - 380, z, '<i></i>', 'lamp');
const TREE = `<svg width="900" height="1100" viewBox="0 0 900 1100"><path fill="#07030d" d="M430 1100 L470 1100 L465 700 L560 520 L700 430 L690 415 L555 500 L600 330 L585 325 L535 480 L470 610 L462 420 L540 260 L520 255 L455 380 L430 230 L415 235 L438 420 L420 600 L330 450 L250 400 L240 410 L320 470 L410 640 L300 560 L180 560 L178 575 L300 590 L425 700 Z"/></svg>`;
for (let z = -1500, i = 0; z > -16000; z -= 1700, i++) side((i % 2 ? 1 : -1) * (1500 + rnd() * 300), GROUND - 520, z, TREE, '', { far: 11000 });
for (let z = -1200; z > -16000; z -= 1300) side(rnd() * 600 - 300, GROUND - 120, z, '', 'fog');
// neon rings to fly through
const RINGS = [-8300, -12900].map(z => side(0, -60, z, '', 'ring', { near: 350 }));
// floating lines the camera passes, like the reference
const WORDS = [['Suis-les…', -3200, -150, -40, 190], ['ne les perds pas !', -4400, 100, -20, 160],
  ['Un mot,', -9500, 150, -40, 190], ['sans voyelles…', -10800, -150, -20, 170], ['à toi de le trouver !', -12100, 60, 0, 150]]
  .map(([w, z, x, y, s]) => { const o = side(x, y, z, w, 'fly', { near: 420, far: 1100, fw: 700 }); o.d.style.fontSize = s + 'px'; return o; });
// the phone at the end of the road
const KB = ['AZERTYUIOP', 'QSDFGHJKLM', 'WXCVBN'].map(r => `<div class="kr">${[...r].map(c => `<i class="${'AEIOUY'.includes(c) ? 'g' : ''}">${c}</i>`).join('')}</div>`).join('');
const PHONE = add(`<div class="scr app"><div class="isl"></div><div class="sb"><span>20:31</span><span>●●● ▮</span></div>
  <div class="hd"><b>Mot du jour</b><small>Général · Facile</small></div><div class="hw" id="hw"></div><div class="rule"></div>
  <div class="hint">Chrono officiel. 20 essais pour trouver le mot.</div><div class="ans">votre réponse</div>
  <div class="kb">${KB}<div class="val">Valider</div></div><div class="flash" id="phF"></div></div>`, 'phone', 0, GROUND - 640, -16300, { near: 150, far: 20000 });
// HALLOWEEN on the screen: consonants shown, gold slots where the vowels go
const HW = [...'HALLOWEEN'].map(c => { const sp = document.createElement('span'); const v = 'AEIOU'.includes(c);
  sp.innerHTML = v ? `<b style="font-weight:400">${c}</b><i></i>` : c; if (v) sp.className = 'v'; $('hw').appendChild(sp); return { sp, c, v }; });
const SLOT = { 0: 1, 1: 4, 2: 6, 3: 7 };   // runaway vowel (A O E E) -> its own letter in HALLOWEEN
const LAND = { 0: 18.6, 1: 18.9, 2: 19.2, 3: 19.45 };
// bats
const BAT_WING = 'M0 0 C -8 -16 -26 -22 -52 -14 C -46 -8 -44 -2 -44 4 C -38 -2 -30 -1 -26 5 C -22 -1 -14 -1 -10 6 Z';
function makeBat(s) {
  const o = add(`<svg width="120" height="60" viewBox="-60 -30 120 60" style="overflow:visible"><path class="wl" d="${BAT_WING}" fill="#0a0510"/><path class="wr" d="${BAT_WING}" fill="#0a0510"/>
    <ellipse cx="0" cy="2" rx="7" ry="11" fill="#0a0510"/><path d="M-6 -6 L-8 -16 L-2 -9 Z M6 -6 L8 -16 L2 -9 Z" fill="#0a0510"/></svg>`, 'bat', 0, 0, 0, { near: 200 });
  o.s = s; o.wl = o.d.querySelector('.wl'); o.wr = o.d.querySelector('.wr'); o.ph = rnd() * 6; return o;
}
const BATS = Array.from({ length: 22 }, () => makeBat(1.4 + rnd() * 1.6));
// the six runaway vowels, always in the same order
// the four runaway vowels of HALLOWEEN: A, O, E, E
const VOW = ['A', 'O', 'E', 'E'].map((c, i) => { const o = add(c, 'vow', 0, 0, 0, { near: 200, far: 20000 }); o.i = i; o.ph = i * 1.7; return o; });
// the hook: the HALLOWEEN neon sign the vowels leave
const SIGN = add('', 'neonTxt', 0, -250, -900, { near: 300, far: 20000 }); SIGN.d.style.fontSize = '235px';

// sky
const stars = Array.from({ length: 260 }, () => ({ x: rnd() * 1080, y: rnd() * 980, r: 0.6 + rnd() * 1.8, ph: rnd() * 6.28, sp: 0.6 + rnd() * 2 }));
(() => { // skyline: hills and houses with lit windows
  let s = '<path d="M0 300 C 300 240 600 270 900 280 C 1200 290 1500 230 1800 250 C 2100 270 2400 240 2600 260 L2600 420 L0 420 Z" fill="#12082a"/>';
  for (let x = 40; x < 2560; x += 150 + Math.round(rnd() * 120)) { const w = 70 + Math.round(rnd() * 60), top = 120 + Math.round(rnd() * 120);
    s += `<path fill="#0c0518" d="M${x} 330 L${x} ${top + 40} L${x + w / 2} ${top} L${x + w} ${top + 40} L${x + w} 330 Z"/>`;
    for (let j = 0; j < 3; j++) s += `<rect x="${x + 14 + j * (w - 36) / 2}" y="${top + 60 + (j % 2) * 30}" width="12" height="16" fill="#ffb347" opacity="${(0.4 + 0.6 * rnd()).toFixed(2)}"/>`; }
  $('skyline').innerHTML = s + '<path d="M0 330 L2600 330 L2600 420 L0 420 Z" fill="#0a0414"/>'; })();

// ================================================================ setup
let OUT, SIGN_L;
window.setup = async () => {
  await document.fonts.ready;
  $('apple').setAttribute('d', APPLE); fitFont($('mark'), 'CONSONNE', 980, 200); document.querySelectorAll('.tt').forEach(p => p.setAttribute('d', TIKTOK));
  WORDS.forEach(o => { o.d.style.textShadow = extrude(10, 0.9, 1.3); });
  SIGN_L = [...'HALLOWEEN'].map(c => { const sp = document.createElement('span'); sp.textContent = c; sp.style.display = 'inline-block'; SIGN.d.appendChild(sp); return { sp, c, v: 'AOE'.includes(c) }; });
  SIGN.d.style.textShadow = extrude(10, 1, 1.4);
  const W = SIGN.d.getBoundingClientRect().width;
  SIGN_L.forEach(l => { l.w = l.sp.getBoundingClientRect().width; l.cx = l.sp.offsetLeft + l.w / 2 - W / 2; });
  // where each vowel ends on the phone screen, in the phone's own pixels, once the word is complete
  HW.forEach(h => { h.w = h.sp.getBoundingClientRect().width; });
  const local = el => { let x = 0, y = 0; for (let e = el; e && !e.classList.contains('phone'); e = e.offsetParent) { x += e.offsetLeft; y += e.offsetTop; } return [x, y]; };
  HW.forEach(h => { const [x, y] = local(h.sp); h.lx = x + h.w / 2 + 16; h.ly = y + h.sp.offsetHeight * 0.55 + 16; });
  HW.forEach(h => { if (h.v) { h.dash = 52; } });
  fitFont($('mark'), 'CONSONNE', 980, 200); OUT = buildWord($('mark'), 'CONSONNE'); measure(OUT); $('mark').style.textShadow = extrude(14, 1);
  return true;
};

// ================================================================ camera
// steady cruise with short ramps, so every floating line stays on screen about a second
const cruise = (x, r = 0.12) => { x = clamp(x); const v = 1 / (1 - r); return x < r ? v * x * x / (2 * r) : x > 1 - r ? 1 - v * (1 - x) * (1 - x) / (2 * r) : v * (x - r / 2); };
const camZ = t => kf([[0, 900], [4.4, 860], [17.9, -14250], [19.0, -15150]], t, cruise);   // the end card waits for the voice: see the dive at 20.95
window.passTimes = () => { const zs = { rings: RINGS.map(r => r.z), words: WORDS.map(w => w.z), carved: OBJ.filter(o => o.d.classList.contains('carve')).map(o => o.z) }, out = {};
  for (const k in zs) out[k] = zs[k].map(z => { for (let t = 0; t < 30; t += 1 / 60) if (camZ(t) <= z) return +t.toFixed(2); return null; }); return out; };

// ================================================================ frame
window.render = (t) => {
  const cz = camZ(t), cx = roadX(cz), cy = 0;
  const yaw = heading(cz - 900);                              // look into the bend ahead
  const roll = -yaw * 180 / Math.PI * 0.3;
  const pitch = lerp(-13, 0, prog(t, 15.5, 18.5));            // negative = looking down at the road
  // CSS puts the eye at z = +perspective: move it onto the camera so that scale = P / distance
  $('scene').style.transform = `translateZ(${P}px) rotateZ(${roll}deg) rotateX(${pitch}deg) rotateY(${yaw}rad) translate3d(${-cx}px, ${-cy}px, ${-cz}px)`;
  // sky: slides sideways as the camera turns
  const sx = -Math.tan(yaw) * P * 0.7;
  const g = $('stars').getContext('2d'); g.clearRect(0, 0, 1080, 1920);
  stars.forEach(s => { g.globalAlpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph)); g.fillStyle = '#fff'; g.beginPath(); g.arc(((s.x + sx * 0.6) % 1080 + 1080) % 1080, s.y, s.r, 0, 7); g.fill(); });
  const hz = 960 + Math.tan(pitch * Math.PI / 180) * P;     // horizon height on screen
  Object.assign($('moon').style, { left: (690 + sx * 0.6) + 'px', top: (hz - 700) + 'px', width: '250px', height: '250px' });
  const grow = 1 + 0.18 * prog(cz, 500, -14500);
  $('skyline').style.top = (hz - 340) + 'px'; $('skyline').style.transform = `translateX(${sx}px) rotate(${roll}deg) scale(${grow})`;
  $('horizon').style.top = (hz - 180) + 'px'; $('groundbg').style.top = (hz - 6) + 'px'; $('groundbg').style.transform = `rotate(${roll}deg)`;
  // subtitles of the voice-over (times = where each line sits in the video, see voice.py)
  const CAPS = [['« Ahhh ! Les voyelles s’échappent ! »', 0.8, 2.8], ['« Chaque jour, un nouveau mot… sans ses voyelles. »', 3.3, 6.5],
    ['« Viens nous aider à les retrouver ! »', 6.7, 8.3], ['« Regarde ! Elles retrouvent leur place ! »', 17.0, 19.0], ['« Halloween ! »', 19.75, 20.9, 'g'],
    ['« Pour jouer, tape C. N. S. N. N. sur l’App Store. »', 22.4, 25.4], ['« C’est juste le mot consonne… sans ses voyelles ! »', 25.7, 28.2], ['« Et c’est gratuit ! »', 28.3, 29.5, 'g']];
  if (!$('cap').children.length) CAPS.forEach(([txt, , , cl]) => { const sp = document.createElement('span'); sp.textContent = txt; if (cl) sp.className = cl; $('cap').appendChild(sp); });
  CAPS.forEach(([, a, b], j) => { const k = ease(prog(t, a, a + 0.25)) * (1 - prog(t, b, b + 0.2)); set($('cap').children[j], k, `translateY(${(1 - ease(prog(t, a, a + 0.25))) * 20}px)`); });
  $('cap').style.top = t > 22 ? '1760px' : '1420px'; $('cap').style.fontSize = t > 22 ? '50px' : '74px';

  // ---- the hook: HALLOWEEN is lit; on "Ahhh !" its A, O, E, E jump out: HLLWN
  const lerp3 = (a, b, k) => a.map((v, j) => lerp(v, b[j], k));
  const POP = [[1, 1.05], [4, 1.2], [6, 1.35], [7, 1.5]];            // vowel -> [letter of HALLOWEEN, time it jumps out]
  SIGN_L.forEach((l, j) => { const pop = POP.find(([k]) => k === j); if (pop) l.sp.style.opacity = t < pop[1] ? 1 : 0;
    if (l.v) { l.sp.style.maxWidth = (l.w * (1 - ease(prog(t, 1.9, 2.4)))) + 'px'; l.sp.style.overflow = 'visible'; } });
  SIGN.op = t < 0.25 ? (Math.sin(t * 90) > 0 ? 1 : 0.2) : t > 1.1 && t < 2.4 ? (Math.sin(t * 47) > 0.1 ? 1 : 0.35) : 1;
  VOW.forEach(v => {
    const i = v.i;
    const row = [(i - 1.5) * 250, -600 + Math.sin(t * 2.2 + i * 1.7) * 18, -900];
    const shake = prog(t, 2.7, 2.85) * (1 - prog(t, 3.3 + i * 0.15, 3.4 + i * 0.15));
    row[0] += Math.sin(t * 70 + i) * 14 * shake; row[1] += Math.cos(t * 63 + i) * 10 * shake;
    const [j, t0] = POP[i], l = SIGN_L[j], kp = io(prog(t, t0, t0 + 0.6));
    let pos = lerp3([l.cx, SIGN.y, SIGN.z + 20], row, kp); pos[1] -= Math.sin(Math.PI * kp) * 280;
    let op = t >= t0 ? 1 : 0, sc = 1;
    // the escape: one by one they dash far down the road, then the camera catches up
    const lead = lerp(3800, 1650, ease(prog(t, 5.2, 8.2))) + 150 * Math.sin(t * 1.3 + i * 1.7);
    const zc = cz - lead;
    const chase = [roadX(zc) + (i - 1.5) * 300 + Math.sin(t * 1.9 + i) * 40, -420 + Math.cos(t * 2.3 + i) * 50 + (i % 2) * 110, zc];
    pos = lerp3(pos, chase, io(prog(t, 3.3 + i * 0.15, 4.3 + i * 0.15)));
    // the end: each one dives back into its own slot of HLLWN on the phone
    const h = HW[SLOT[i]], land = LAND[i];
    const target = [PHONE.x - 280 + h.lx, PHONE.y - 590 + h.ly, PHONE.z + 6];
    const k2 = io(prog(t, land - 1.6, land)); pos = lerp3(pos, target, k2); sc *= lerp(1, 0.5, k2);
    op *= 1 - prog(t, land, land + 0.08);
    v.x = pos[0]; v.y = pos[1]; v.z = pos[2]; v.op = op;
    const hop = Math.exp(-Math.pow((t - (3.3 + i * 0.15)) / 0.12, 2));  // a little jump before the dash
    v.rot = `translateY(${-hop * 60}px) rotateZ(${Math.sin(t * 5 + i) * 12 * (1 - prog(t, 17.5, 18.3))}deg) scale(${sc * (1 + 0.15 * hop)}, ${sc * (1 - 0.1 * hop)})`;
  });
  // the word on the phone fills in as each vowel lands
  HW.forEach((h, j) => { if (!h.v) return; const k = Object.keys(SLOT).find(q => SLOT[q] === j); const pr = clamp(spring(t - LAND[k], 0.4, 0.6), 0, 1.2);
    h.sp.style.width = lerp(h.dash, h.w, clamp(pr)) + 'px'; h.sp.querySelector('b').style.opacity = clamp(pr * 1.5); h.sp.querySelector('i').style.opacity = 1 - clamp(pr * 2);
    h.sp.style.transform = `scale(${lerp(1.4, 1, clamp(pr))})`; });
  const done = Math.exp(-Math.max(0, t - 19.75) * 2) * (t >= 19.75 ? 1 : 0);
  $('hw').style.filter = `drop-shadow(0 0 ${30 * done}px rgba(255,198,90,${done}))`;
  $('phF').style.opacity = Math.max(...Object.values(LAND).map(l => Math.exp(-Math.pow((t - l) / 0.07, 2)))) * 0.55;
  // ---- bats: two colonies cross towards the camera during the chase
  BATS.forEach((b, i) => { const t0 = 7.0 + (i % 11) * 0.12 + (i > 10 ? 5.0 : 0), p = (t - t0) / 1.8;
    if (p < 0 || p > 1) { b.op = 0; return; } b.op = 1;
    const zz = camZ(t0) - 2600 + p * 2300; b.x = roadX(zz) + Math.cos(i * 2.4) * lerp(300, 900, p); b.y = -400 + Math.sin(i * 1.7) * 260 - p * 200; b.z = zz;
    const w = Math.sin(t * (10 + i % 4) + b.ph); b.rot = `scale(${b.s})`;
    b.wl.setAttribute('transform', `rotate(${w * 28}) scale(1, ${0.55 + 0.45 * Math.abs(w)})`); b.wr.setAttribute('transform', `scale(-1,1) rotate(${w * 28}) scale(1, ${0.55 + 0.45 * Math.abs(w)})`); });
  PUMPS.forEach(o => { o.d.querySelector('.face').style.opacity = 0.75 + 0.25 * Math.sin(t * 13 + o.ph) * Math.sin(t * 7.3 + o.ph * 2); });
  RINGS.forEach(r => { r.rot = `rotateY(${-heading(r.z)}rad) rotateZ(${t * 20}deg)`; });
  WORDS.forEach(w => { const d = cz - w.z; w.rot = `rotateY(${-yaw}rad) rotateY(${clamp((d - 600) / 3000) * (w.x - roadX(w.z) < 0 ? 20 : -20)}deg)`; });
  PHONE.rot = `rotateY(${lerp(-14, 0, prog(t, 14, 17))}deg)`;
  // ---- dive into the screen, flash, end card
  const dive = io(prog(t, 20.95, 22.1));
  if (dive > 0) { const z0 = camZ(20.9); const zz = lerp(z0, PHONE.z + 140, dive);
    $('scene').style.transform = `translateZ(${P}px) rotateX(${lerp(pitch, 0, dive)}deg) translate3d(0px, ${-lerp(0, PHONE.y - 590 + HW[4].ly, dive)}px, ${-zz}px)`; }
  const czEff = dive > 0 ? lerp(camZ(20.9), PHONE.z + 140, dive) : cz;
  OBJ.forEach(o => place(o, czEff));
  $('flashAll').style.opacity = Math.exp(-Math.pow((t - 22.15) / 0.22, 2));

  // ---- end card 22.15–30: CNSNN, typed in the App Store search; "consonne without its vowels"; free
  const e = t >= 22.15; set($('end'), e ? 1 : 0);
  if (e) {
    const mk = ease(prog(t, 22.2, 22.7)); set($('mark'), mk, `scale(${lerp(1.25, 1, mk)})`);
    reveal(OUT, i => spring(t - (25.9 + i * 0.2)));                  // on "le mot consonne", the vowels drop in
    $('eline').style.transform = `scaleX(${io(prog(t, 22.6, 23.3))})`;
    $('emoon').style.transform = `translateY(${lerp(80, 0, ease(prog(t, 22.2, 23.2)))}px)`;
    const sb = spring(t - 22.7, 0.5, 0.75); set($('search'), clamp(sb * 1.4), `translateY(${(1 - sb) * 40}px)`);
    const typed = 'CNSNN'.slice(0, Math.max(0, Math.min(5, Math.floor((t - 23.3) / 0.28) + 1)));   // typed with the spelling
    $('typed').textContent = typed; $('ph').style.opacity = typed ? 0 : 1;
    $('caret').style.opacity = Math.floor(t * 2.2) % 2 || (t > 23.2 && t < 24.8) ? 1 : 0;
    const rs = spring(t - 24.75, 0.5, 0.7); set($('result'), clamp(rs * 1.4), `translateY(${(1 - rs) * 40}px)`);
    const fr = spring(t - 28.3, 0.45, 0.55); set($('free'), clamp(fr * 1.5), `scale(${lerp(0.6, 1, clamp(fr))})`);
    const pulse = 1 + 0.08 * Math.exp(-Math.pow((t - 28.4) / 0.15, 2)); $('get').style.transform = `scale(${pulse})`;
    $('get').style.background = t > 28.3 ? '#0a84ff' : '#2c2c2e'; $('get').style.color = t > 28.3 ? '#fff' : '#0a84ff';
    set($('storeTag'), ease(prog(t, 25.0, 25.4)));
    const tk = spring(t - 25.2, 0.5, 0.75); set($('tiktok'), clamp(tk * 1.4), `translateY(${(1 - tk) * 40}px)`);
  }
  return true;
};
</script>
</body>
