<script>

let seed = 1031; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const NS = 'http://www.w3.org/2000/svg';
const kf = (keys, t, f = io) => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 0; i < keys.length - 1; i++) { const [a, va] = keys[i], [b, vb] = keys[i + 1];
  if (t <= b) return Array.isArray(va) ? va.map((v, j) => lerp(v, vb[j], f(prog(t, a, b)))) : lerp(va, vb, f(prog(t, a, b))); } return keys[keys.length - 1][1]; };
const extrude = (depth, glow, step = 1.6) => { const s = []; for (let i = 1; i <= depth; i++) { const c = Math.round(lerp(200, 70, i / depth)); s.push(`0 ${i * step}px 0 rgb(${c},${Math.round(c * 0.38)},0)`); }
  s.push(`0 0 ${30 * glow}px rgba(255,150,40,${0.9 * glow})`, `0 0 ${90 * glow}px rgba(255,100,0,${0.6 * glow})`); return s.join(','); };

// ================================================================ world
// Units are CSS px. Camera looks down -z; y grows downwards; the road is at y = GROUND.
const P = 1000, GROUND = 520;
// The road bends left, then right: roadX(z) is its centre line, heading(z) its direction (> 0 = turning right)
const ROAD0 = -1800, ROAD1 = -13600;
const roadX = z => { const u = clamp((ROAD0 - z) / (ROAD0 - ROAD1)); return -1300 * Math.sin(2 * Math.PI * u) * Math.sin(Math.PI * u); };
const heading = z => Math.atan2(roadX(z - 50) - roadX(z + 50), 100);
const OBJ = [];
function add(html, cls, x, y, z, opt = {}) {
  const d = document.createElement('div'); d.className = 'o ' + (cls || ''); if (html) d.innerHTML = html;
  $('scene').appendChild(d); const o = { d, x, y, z, rot: opt.rot || '', near: opt.near ?? 260, far: opt.far ?? 9000, op: 1, fw: opt.fw || 2500, ext: opt.ext || 0, anchor: opt.anchor || 'translate(-50%,-50%)' };
  OBJ.push(o); return o;
}
// things that stand beside the road follow its bend
const side = (dx, y, z, html, cls, opt) => add(html, cls, roadX(z) + dx, y, z, opt);
function place(o, cz) {
  if (o.tile) {   // ground slabs: drop any slab that reaches behind the camera (Chromium would not draw it anyway)
    const near = cz - (o.z + 140), op = clamp(1 - (near - o.far) / 2500);
    if (near < 5 || op <= 0.003) { o.d.style.visibility = 'hidden'; return; }

  }

  let op = o.op * clamp((dist - 60) / o.near) * clamp(1 - (dist - o.ext - o.far) / o.fw);

  o.d.style.visibility = 'visible'; o.d.style.opacity = op;

// ground: slabs of cobbled road with neon edges, turned along the bend
const cob = document.createElement('canvas'); cob.width = cob.height = 512;

  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) { const x = c * 58 + (r % 2) * 29 + rnd() * 6, y = r * 58 + rnd() * 6;
    const l = 30 + rnd() * 18; g.fillStyle = `rgb(${l + 8},${l},${l + 22})`; g.beginPath(); g.ellipse(x, y, 25 + rnd() * 3, 23 + rnd() * 3, rnd(), 0, 7); g.fill();
    g.fillStyle = 'rgba(200,180,255,.06)'; g.beginPath(); g.ellipse(x - 5, y - 6, 12, 8, 0, 0, 7); g.fill(); } })();
const COB = cob.toDataURL();
for (let z = 1000, k = 0; z > -18000; z -= 250, k++) {
  const zc = z - 125;

}
// jack-o'-lanterns
const PUMP_BODY = `<path d="M-2 -40 C -2 -52 6 -58 12 -60 L 14 -54 C 8 -52 5 -47 5 -40 Z" fill="#3e5a1e"/>

for (let z = -700, i = 0; z > -16500; z -= 520 + rnd() * 380, i++) {

// the six runaway vowels, always in the same order
const VOW = ['A', 'E', 'I', 'O', 'U', 'Y'].map((c, i) => { const o = add(c, 'vow', 0, 0, 0, { near: 200, far: 20000 }); o.i = i; o.ph = i * 1.3; return o; });

// sky
const stars = Array.from({ length: 260 }, () => ({ x: rnd() * 1080, y: rnd() * 980, r: 0.6 + rnd() * 1.8, ph: rnd() * 6.28, sp: 0.6 + rnd() * 2 }));
(() => { // skyline: hills and houses with lit windows
  let s = '<path d="M0 300 C 300 240 600 270 900 280 C 1200 290 1500 230 1800 250 C 2100 270 2400 240 2600 260 L2600 420 L0 420 Z" fill="#12082a"/>';
  for (let x = 40; x < 2560; x += 150 + Math.round(rnd() * 120)) { const w = 70 + Math.round(rnd() * 60), top = 120 + Math.round(rnd() * 120);

// ================================================================ camera
// steady cruise with short ramps, so every floating line stays on screen about a second
const cruise = (x, r = 0.12) => { x = clamp(x); const v = 1 / (1 - r); return x < r ? v * x * x / (2 * r) : x > 1 - r ? 1 - v * (1 - x) * (1 - x) / (2 * r) : v * (x - r / 2); };
const camZ = t => kf([[0, 900], [2.8, 500], [16.3, -14250], [17.6, -14500]], t, cruise);
window.passTimes = () => { const zs = { rings: RINGS.map(r => r.z), words: WORDS.map(w => w.z), carved: OBJ.filter(o => o.d.classList.contains('carve')).map(o => o.z) }, out = {};
  for (const k in zs) out[k] = zs[k].map(z => { for (let t = 0; t < 26; t += 1 / 60) if (camZ(t) <= z) return +t.toFixed(2); return null; }); return out; };

// ================================================================ frame
const ROW_Z = -500;   // where the vowels wait at the start
window.render = (t) => {
  const cz = camZ(t), cx = roadX(cz), cy = 0;
  const yaw = heading(cz - 900);                              // look into the bend ahead
  const roll = -yaw * 180 / Math.PI * 0.3;
  const pitch = lerp(-13, -6, prog(t, 15, 17.2));            // negative = looking down at the road
  // CSS puts the eye at z = +perspective: move it onto the camera so that scale = P / distance
  $('scene').style.transform = `translateZ(${P}px) rotateZ(${roll}deg) rotateX(${pitch}deg) rotateY(${yaw}rad) translate3d(${-cx}px, ${-cy}px, ${-cz}px)`;
  // sky: slides sideways as the camera turns
  const sx = -Math.tan(yaw) * P * 0.7;
  const g = $('stars').getContext('2d'); g.clearRect(0, 0, 1080, 1920);
  stars.forEach(s => { g.globalAlpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph)); g.fillStyle = '#fff'; g.beginPath(); g.arc(((s.x + sx * 0.6) % 1080 + 1080) % 1080, s.y, s.r, 0, 7); g.fill(); });
  const hz = 960 + Math.tan(pitch * Math.PI / 180) * P;     // horizon height on screen
  Object.assign($('moon').style, { left: (690 + sx * 0.6) + 'px', top: (hz - 700) + 'px', width: '250px', height: '250px' });
  const grow = 1 + 0.18 * prog(cz, 500, -14500);
  $('skyline').style.top = (hz - 340) + 'px'; $('skyline').style.transform = `translateX(${sx}px) rotate(${roll}deg) scale(${grow})`;
  $('horizon').style.top = (hz - 180) + 'px'; $('groundbg').style.top = (hz - 6) + 'px'; $('groundbg').style.transform = `rotate(${roll}deg)`;
  // opening caption
  const c1 = ease(prog(t, 0.2, 0.6)), c2 = ease(prog(t, 0.8, 1.3)), cOut = prog(t, 3.3, 3.8);
  set($('cap1'), c1 * (1 - cOut), `translateY(${(1 - c1) * 20}px)`); $('cap1').style.display = 'inline-block';
  set($('cap2'), c2 * (1 - cOut), `translateY(${(1 - c2) * 20}px)`); $('cap2').style.display = 'inline-block';
  $('cap').style.visibility = t < 3.9 ? 'visible' : 'hidden';

  // ---- vowels: lined up A E I O U Y, they tremble, then dash off one by one down the road
  VOW.forEach(v => {
    const row = [(v.i - 2.5) * 220, -230 + Math.sin(t * 2.2 + v.ph) * 18, ROW_Z];
    const shake = prog(t, 1.4, 1.6) * (1 - prog(t, 2.0 + v.i * 0.12, 2.1 + v.i * 0.12));
    row[0] += Math.sin(t * 70 + v.i) * 14 * shake; row[1] += Math.cos(t * 63 + v.i) * 10 * shake;
    const lead = lerp(3800, 1650, ease(prog(t, 3.6, 6.6))) + 150 * Math.sin(t * 1.3 + v.ph);   // they race far ahead, then we catch up
    const zc = cz - lead;
    const chase = [roadX(zc) + (v.i - 2.5) * 260 + Math.sin(t * 1.9 + v.ph) * 40, -420 + Math.cos(t * 2.3 + v.ph) * 50 + (v.i % 2) * 110, zc];
    const go = io(prog(t, 2.0 + v.i * 0.12, 3.0 + v.i * 0.12));
    const screen = [PHONE.x + (v.i - 2.5) * 60, PHONE.y - 230, PHONE.z + 20];
    let p = row.map((s, k) => lerp(s, chase[k], go));
    p = p.map((s, k) => lerp(s, screen[k], io(prog(t, 15.6 + v.i * 0.15, 16.9 + v.i * 0.22))));
    const pDive = prog(t, 16.9 + v.i * 0.22, 17.5 + v.i * 0.22);          // into the phone screen
    v.x = p[0]; v.y = p[1]; v.z = p[2];
    v.op = ease(prog(t, 0.1 + v.i * 0.08, 0.5 + v.i * 0.08)) * (1 - pDive);
    const hop = Math.exp(-Math.pow((t - (2.0 + v.i * 0.12)) / 0.12, 2));  // a little jump before the dash
    v.rot = `translateY(${-hop * 60}px) rotateZ(${Math.sin(t * 5 + v.ph) * 12}deg) scale(${lerp(1, 0.25, pDive) * (1 + 0.15 * hop)}, ${lerp(1, 0.25, pDive) * (1 - 0.1 * hop)})`;
  });
  // ---- bats: two colonies cross towards the camera during the chase
  BATS.forEach((b, i) => { const t0 = 6.0 + (i % 11) * 0.12 + (i > 10 ? 4.8 : 0), p = (t - t0) / 1.8;
    if (p < 0 || p > 1) { b.op = 0; return; } b.op = 1;
    const zz = camZ(t0) - 2600 + p * 2300; b.x = roadX(zz) + Math.cos(i * 2.4) * lerp(300, 900, p); b.y = -400 + Math.sin(i * 1.7) * 260 - p * 200; b.z = zz;
    const w = Math.sin(t * (10 + i % 4) + b.ph); b.rot = `scale(${b.s})`;
    b.wl.setAttribute('transform', `rotate(${w * 28}) scale(1, ${0.55 + 0.45 * Math.abs(w)})`); b.wr.setAttribute('transform', `scale(-1,1) rotate(${w * 28}) scale(1, ${0.55 + 0.45 * Math.abs(w)})`); });
  PUMPS.forEach(o => { o.d.querySelector('.face').style.opacity = 0.75 + 0.25 * Math.sin(t * 13 + o.ph) * Math.sin(t * 7.3 + o.ph * 2); });
  RINGS.forEach(r => { r.rot = `rotateY(${-heading(r.z)}rad) rotateZ(${t * 20}deg)`; });
  WORDS.forEach(w => { const d = cz - w.z; w.rot = `rotateY(${-yaw}rad) rotateY(${clamp((d - 600) / 3000) * (w.x - roadX(w.z) < 0 ? 20 : -20)}deg)`; });
  // ---- phone: the vowels land, the screen flashes and shows the found word
  $('phF').style.opacity = Math.max(...[0, 1, 2, 3, 4, 5].map(i => Math.exp(-Math.pow((t - (17.5 + i * 0.22)) / 0.08, 2)))) * 0.9;
  $('phB').style.opacity = ease(prog(t, 18.3, 18.6));
  PHONE.rot = `rotateY(${lerp(-14, 0, prog(t, 14, 17.5))}deg)`;
  // ---- dive into the screen, flash, end card
  const dive = io(prog(t, 19.0, 20.2));
  if (dive > 0) { const z0 = camZ(18.9); const zz = lerp(z0, PHONE.z + 140, dive);
    $('scene').style.transform = `translateZ(${P}px) rotateX(${lerp(pitch, 0, dive)}deg) translate3d(0px, ${-lerp(0, PHONE.y, dive)}px, ${-zz}px)`; }
  const czEff = dive > 0 ? lerp(camZ(18.9), PHONE.z + 140, dive) : cz;
  OBJ.forEach(o => place(o, czEff));
  $('flashAll').style.opacity = Math.exp(-Math.pow((t - 20.25) / 0.22, 2));

  // ---- end card 20.25–26
  const e = t >= 20.25; set($('end'), e ? 1 : 0);
  if (e) {
    const mk = ease(prog(t, 20.3, 20.8)); set($('mark'), mk, `scale(${lerp(1.25, 1, mk)})`);
    reveal(OUT, i => spring(t - (21.0 + i * 0.18)));
    $('eline').style.transform = `scaleX(${io(prog(t, 21.2, 21.9))})`;
    $('emoon').style.transform = `translateY(${lerp(80, 0, ease(prog(t, 20.3, 21.3)))}px)`;
    [['tw1', 22.0], ['tw2', 22.35]].forEach(([id, t0]) => { const p = spring(t - t0, 0.45, 0.6); set($(id), clamp(p * 1.5), `translateY(${(1 - p) * 40}px)`); });
    const st = spring(t - 23.0, 0.5, 0.75); set($('store'), clamp(st * 1.4), `translateY(${(1 - st) * 50}px)`);
    const tk = spring(t - 23.3, 0.5, 0.75); set($('tiktok'), clamp(tk * 1.4), `translateY(${(1 - tk) * 40}px)`);
  }
  return true;
};
</script>
</body>
</html>
